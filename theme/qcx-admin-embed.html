  /** Blogger/Google image CDN hosts used by Blogspot posts. */
  function isBloggerImageHost(url) {
    try {
      var host = new URL(String(url || ''), location.href).hostname.toLowerCase();
      if (host === 'blogger.googleusercontent.com') return true;
      if (/\.bp\.blogspot\.com$/.test(host) || host === 'bp.blogspot.com') return true;
      if (/^lh\d*\.googleusercontent\.com$/.test(host)) return true;
      return false;
    } catch (e) {
      return false;
    }
  }

  /**
   * Replace Blogspot size token in a CDN URL.
   * Shapes: /s1600/file.jpg | /=s1600 | /w640-h360-p-k-no-nu/file.jpg
   * Non-CDN URLs are returned unchanged.
   */
  function withBloggerSize(url, token) {
    var raw = String(url || '').trim();
    var size = String(token || 's1600').replace(/^\/+|\/+$/g, '');
    if (!raw || !isBloggerImageHost(raw)) return raw;
    try {
      var u = new URL(raw, location.href);
      var path = u.pathname;
      // /img/b/.../s####/name  or  /img/b/.../w#-h#-…/name
      if (/\/(?:s\d+(?:-[a-z0-9]+)*)\//i.test(path) || /\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i.test(path)) {
        path = path
          .replace(/\/(?:s\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/')
          .replace(/\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/');
      } else if (/=s\d+(?:-[a-z0-9]+)*/i.test(path) || /=[wh]\d+(?:-[a-z0-9]+)*/i.test(path)) {
        // /img/a/HASH=s1600  or =w640-h360-…
        path = path
          .replace(/=s\d+(?:-[a-z0-9]+)*/i, '=' + size)
          .replace(/=[wh]\d+(?:-[a-z0-9]+)*/i, '=' + size);
      } else if (/\/s\d+(?:-[a-z0-9]+)*$/i.test(path) || /\/[wh]\d+(?:-[a-z0-9]+)*$/i.test(path)) {
        path = path
          .replace(/\/s\d+(?:-[a-z0-9]+)*$/i, '/' + size)
          .replace(/\/[wh]\d+(?:-[a-z0-9]+)*$/i, '/' + size);
      } else {
        // No size segment — insert before filename if path has a trailing file
        path = path.replace(/\/([^\/]+)$/, '/' + size + '/$1');
      }
      u.pathname = path;
      return u.toString();
    } catch (e) {
      return raw;
    }
  }

  function normalizeHeroUrl(url) {
    var raw = String(url || '').trim();
    if (!raw) return '';
    if (!isBloggerImageHost(raw)) return raw;
    return withBloggerSize(raw, 's1600');
  }

  /* Keep in sync with media/labels_allowlist.json */
  var LABEL_ALLOWLIST = {
    topics: [
      'AI', 'API', 'Antigravity', 'Automation', 'CapCut', 'ChatGPT', 'Cloud', 'Cursor',
      'Dev', 'Developer', 'DevOps', 'Editing', 'ElevenLabs', 'Facebook', 'Gemini', 'Google',
      'Google Cloud', 'IOS', 'Instagram', 'LINE', 'Linux', 'MOBILE', 'Meta', 'Student',
      'Tools', 'Video', 'Voice'
    ],
    aliases: {
      'google-cloud': 'Google Cloud', googlecloud: 'Google Cloud', chatgpt: 'ChatGPT', gpt: 'ChatGPT',
      fb: 'Facebook', ig: 'Instagram', ios: 'IOS', mobile: 'MOBILE', devops: 'DevOps',
      elevenlabs: 'ElevenLabs', capcut: 'CapCut', antigravity: 'Antigravity'
    }
  };

  function canonicalizeLabel(name) {
    var raw = String(name || '').trim();
    if (!raw) return '';
    var key = raw.toLowerCase().replace(/\s+/g, '-');
    if (LABEL_ALLOWLIST.aliases[key]) return LABEL_ALLOWLIST.aliases[key];
    var hit = LABEL_ALLOWLIST.topics.find(function (t) { return t.toLowerCase() === raw.toLowerCase(); });
    if (hit) return hit;
    if (/^(free|vip|tutorial)$/i.test(raw)) {
      return raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
    }
    if (/^\d{1,3}([.,]\d{3})*$/.test(raw)) return raw; /* price label */
    return raw;
  }

  function parseLabels(raw, currentMode, price) {
    var parts = String(raw || '').split(',').map(function (s) { return canonicalizeLabel(s); }).filter(Boolean);
    var need = currentMode === 'paid' ? 'VIP' : 'FREE';
    var hasNeed = parts.some(function (p) { return p.toUpperCase() === need; });
    if (!hasNeed) parts.unshift(need);
    if (!parts.some(function (p) { return /^tutorial$/i.test(p); })) parts.push('Tutorial');
    if (currentMode === 'paid' && price) {
      var hasPrice = parts.some(function (p) { return p === price; });
      if (!hasPrice) parts.push(price);
    }
    /* de-dupe case-insensitive */
    var seen = {};
    return parts.filter(function (p) {
      var k = p.toLowerCase();
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
  }

  function topicLabelsOf(labels) {
    return (labels || []).filter(function (p) {
      return !/^(free|vip|tutorial)$/i.test(p) && !/^\d{1,3}([.,]\d{3})*$/.test(p);
    });
  }

  function labelsAllowlistOk(labels) {
    var topics = topicLabelsOf(labels);
    if (topics.length < 1 || topics.length > 3) {
      return { ok: false, detail: 'cần 1–3 topic (có ' + topics.length + ')' };
    }
    var bad = topics.filter(function (t) {
      return !LABEL_ALLOWLIST.topics.some(function (a) { return a.toLowerCase() === String(t).toLowerCase(); });
    });
    if (bad.length) return { ok: false, detail: 'ngoài allowlist: ' + bad.join(', ') };
    return { ok: true, detail: topics.join(', ') };
  }

  function collectForm() {
    var title = document.getElementById('title').value.trim();
    var slug = document.getElementById('slug').value.trim() || slugify(title);
    var itemPriceInp = document.getElementById('inpItemPrice');
    var price = mode === 'item' ? (itemPriceInp ? itemPriceInp.value.trim() : '') : (mode === 'vip' ? '500000' : (priceEl ? priceEl.value.trim() : ''));
    var labels = parseLabels(document.getElementById('labels').value, mode, price);
    var heroRaw = document.getElementById('hero').value.trim();
    var videoEl = document.getElementById('videoUrl');
    var videoUrl = videoEl ? videoEl.value.trim() : '';
    if (!videoUrl && /\.(?:mp4|webm|mov)(?:[?#].*)?$/i.test(heroRaw)) {
      videoUrl = heroRaw;
      heroRaw = '';
    }
    var hero = normalizeHeroUrl(heroRaw);
    return {
      title: title,
      slug: slug,
      resourceId: slug,
      mode: mode,
      price: price,
      labels: labels,
      hero: hero,
      heroRaw: heroRaw,
      videoUrl: videoUrl,
      heroIsCdn: !heroRaw || isBloggerImageHost(heroRaw),
      teaser: document.getElementById('teaser').value.trim(),
      locked: document.getElementById('locked').value.trim(),
      driveUrl: document.getElementById('driveUrl').value.trim(),
      notesHtml: document.getElementById('notesHtml').value.trim(),
      blogId: BLOG_ID
    };
  }

  function buildPostHtml(data) {
    var parts = [];
    if (data.videoUrl) {
      var posterSrc = data.hero ? normalizeHeroUrl(data.hero) : '';
      if (posterSrc) {
        parts.push('<img alt="' + escapeAttr(data.title || 'poster') + '" src="' + escapeAttr(posterSrc) + '" style="display:none!important"/>');
      }
      parts.push(
        '<div class="mac-frame mac-frame-video">' +
        '<div class="mac-frame-header"><div class="mac-dots">' +
        '<span class="mac-dot mac-red"></span><span class="mac-dot mac-yellow"></span><span class="mac-dot mac-green"></span>' +
        '</div><div class="mac-title">preview</div><div class="mac-spacer"></div></div>' +
        '<div class="mac-frame-content"><video controls playsinline preload="metadata"' +
        (posterSrc ? ' poster="' + escapeAttr(posterSrc) + '"' : '') +
        ' src="' + escapeAttr(data.videoUrl) + '"></video></div>' +
        '</div>'
      );
    } else if (data.hero) {
      var heroSrc = normalizeHeroUrl(data.hero);
      parts.push(
        '<div class="mac-frame mac-frame-image mac-orient-landscape">' +
        '<div class="mac-frame-header"><div class="mac-dots">' +
        '<span class="mac-dot mac-red"></span><span class="mac-dot mac-yellow"></span><span class="mac-dot mac-green"></span>' +
        '</div><div class="mac-title">preview</div><div class="mac-spacer"></div></div>' +
        '<div class="mac-frame-content"><img alt="' + escapeAttr(data.title || 'hero') + '" src="' + escapeAttr(heroSrc) + '"/></div>' +
        '</div>'
      );
    }
    if (data.teaser) parts.push('<div class="qcx-teaser">\n' + data.teaser + '\n</div>');

    var markerPrice = '';
    if (data.mode === 'item' && data.price) {
      markerPrice = ' data-price="' + escapeAttr(data.price) + '"';
    } else if (data.mode === 'vip') {
      markerPrice = ' data-price="500000"';
    }
    var marker =
      '<div id="qcx-resource" class="qcx-resource-marker" data-mode="' + escapeAttr(data.mode) + '"' +
      ' data-resource-id="' + escapeAttr(data.resourceId) + '"' +
      ' data-title="' + escapeAttr(data.title) + '"' +
      markerPrice +
      ' style="display:none!important">resource:' + escapeAttr(data.resourceId) + '</div>';
    parts.push(marker);

    var locked = data.locked || '<!-- locked content -->';
    parts.push('<div class="container"><div class="qcx-content-unlock" style="display:none">\n' + locked + '\n</div></div>');
    return parts.join('\n\n');
  }

  function validate(data, forVault) {
    var errors = [];
    if (!data.title) errors.push('Thiếu title');
    if (!data.resourceId) errors.push('Thiếu slug/resourceId');
    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.resourceId)) {
      errors.push('resourceId chỉ dùng a-z 0-9 và dấu gạch ngang');
    }
    if (!data.locked) errors.push('Thiếu locked HTML');
    if (!data.teaser) errors.push('Thiếu teaser (.qcx-teaser)');
    if (!(data.labels || []).some(function (l) { return /^tutorial$/i.test(l); })) {
      errors.push('Labels thiếu Tutorial');
    }
    var allow = labelsAllowlistOk(data.labels || []);
    if (!allow.ok) errors.push('Labels: ' + allow.detail);
    if (forVault && !data.driveUrl) errors.push('Thiếu driveUrl cho vault');
    if (data.mode === 'paid' && !data.price) errors.push('Paid cần price');
    if (!forVault) {
      if (!data.hero) errors.push('Thiếu hero CDN (bắt buộc live publish)');
      else if (!data.heroIsCdn) errors.push('Hero phải là Blogspot CDN');
      else if (/images%20%284%29\.jpg/i.test(data.hero)) errors.push('Hero còn placeholder images%20(4).jpg');
      else if (!/\/s1600\/|=s1600|\/s0\//i.test(data.hero)) errors.push('Hero phải dùng token s1600 (CapCut skeleton)');
    }
    var html = buildPostHtml(data);
    if (!/mac-frame/i.test(html)) errors.push('Thiếu .mac-frame hero (CapCut skeleton)');
    if (!/qcx-teaser/i.test(html)) errors.push('HTML thiếu .qcx-teaser');
    if (!/qcx-content-unlock/i.test(html)) errors.push('HTML thiếu .qcx-content-unlock');
    if (!/id=["']qcx-resource["']/i.test(html)) errors.push('HTML thiếu #qcx-resource marker');
    if (/drive\.google\.com/i.test(html)) errors.push('HTML body không được chứa drive.google.com');
    if (/drive\.google\.com/i.test(data.teaser + data.locked)) {
      errors.push('Teaser/locked chứa Drive — chuyển sang vault');
    }
    return { ok: !errors.length, errors: errors, html: html };
  }

  function checkItem(ok, label, detail) {
    return '<li class="check ' + (ok ? 'pass' : 'fail') + '">' +
      '<span class="tick" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span>' +
      '<span class="check-label">' + label + '</span>' +
      (detail ? '<span class="check-detail">' + detail + '</span>' : '') +
      '</li>';
  }

  function renderPreview() {
    var data = collectForm();
    var check = validate(data, false);
    htmlOut.textContent = check.html;
    var titleOk = !!data.title;
    var slugOk = !!data.resourceId && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.resourceId);
    var tutorialOk = (data.labels || []).some(function (l) { return /^tutorial$/i.test(l); });
    var allow = labelsAllowlistOk(data.labels || []);
    var labelsOk = !!(data.labels && data.labels.length) && tutorialOk && allow.ok;
    var teaserOk = !!data.teaser;
    var lockedOk = !!data.locked;
    var driveOk = !!data.driveUrl;
    var heroOk = !!data.hero && data.heroIsCdn && !/images%20%284%29\.jpg/i.test(data.hero || '');
    var noDriveInHtml = !/drive\.google\.com/i.test(check.html) &&
      !/drive\.google\.com/i.test(data.teaser + data.locked);
    var modeDetail = data.mode.toUpperCase() +
      (data.mode === 'paid' ? (data.price ? ' · ' + data.price : ' · thiếu giá') : '');
    var items = [
      checkItem(titleOk, 'Title', titleOk ? data.title.slice(0, 48) : 'Thiếu'),
      checkItem(slugOk, 'Slug', slugOk ? data.resourceId : (data.resourceId || '—')),
      checkItem(data.mode === 'free' || !!data.price, 'Mode', modeDetail),
      checkItem(labelsOk, 'Labels', labelsOk ? data.labels.join(', ') : (allow.detail || 'Thiếu Tutorial / allowlist')),
      checkItem(tutorialOk, 'Tutorial', tutorialOk ? 'ok' : 'thiếu'),
      checkItem(teaserOk, 'Teaser', teaserOk ? 'có' : 'trống'),
      checkItem(lockedOk, 'Locked', lockedOk ? 'có' : 'Thiếu'),
      checkItem(/mac-frame/i.test(check.html), 'mac-frame', /mac-frame/i.test(check.html) ? 'CapCut' : 'thiếu'),
      checkItem(/id=["']qcx-resource["']/i.test(check.html), '#qcx-resource', /id=["']qcx-resource["']/i.test(check.html) ? 'ok' : 'thiếu'),
      checkItem(/qcx-content-unlock/i.test(check.html), 'Unlock', /qcx-content-unlock/i.test(check.html) ? 'ok' : 'thiếu'),
      checkItem(driveOk, 'Drive', driveOk ? 'vault' : 'chưa'),
      checkItem(heroOk, 'Hero CDN', heroOk ? 's1600' : (data.heroRaw ? 'CDN/placeholder lỗi' : 'thiếu')),
      checkItem(noDriveInHtml, 'No Drive in HTML', noDriveInHtml ? 'ok' : 'lỗi')
    ];
    if (data.heroRaw && !heroOk) {
      items.push(checkItem(data.heroIsCdn, 'Hero host', data.heroIsCdn ? 'Blogspot' : 'không phải CDN'));
    }
    if (data.videoUrl) {
      items.push(checkItem(!!data.hero, 'Video + Poster', data.hero ? 'có poster' : 'thiếu poster ảnh tĩnh'));
    }
    previewMeta.innerHTML = items.join('');
    syncLabelChips();
    return check;
  }

  function syncLabelChips() {
    var labelsEl = document.getElementById('labels');
    if (!labelsEl) return;
    var activeSet = {};
    String(labelsEl.value || '').split(',').forEach(function (s) {
      var k = s.trim().toLowerCase();
      if (k) activeSet[k] = true;
    });
    Array.prototype.forEach.call(document.querySelectorAll('#labelChips [data-label]'), function (btn) {
      var tag = (btn.getAttribute('data-label') || '').trim().toLowerCase();
      btn.classList.toggle('active', !!activeSet[tag]);
    });
  }

  function persistDraft() {
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(collectForm())); } catch (e) {}
  }

  function restoreDraft() {
    try {
      var raw = sessionStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      document.getElementById('title').value = d.title || '';
      document.getElementById('slug').value = d.slug || d.resourceId || '';
      document.getElementById('labels').value = (d.labels || []).join(', ');
      document.getElementById('hero').value = d.hero || '';
      var videoEl = document.getElementById('videoUrl');
      if (videoEl) videoEl.value = d.videoUrl || '';
      document.getElementById('teaser').value = d.teaser || '';
      document.getElementById('locked').value = d.locked || '';
      document.getElementById('driveUrl').value = d.driveUrl || '';
      document.getElementById('notesHtml').value = d.notesHtml || '';
      priceEl.value = d.price || '';
      setMode(d.mode === 'paid' ? 'paid' : 'free');
      syncLabelChips();
    } catch (e) {}
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
    var itemRow = document.getElementById('itemPriceRow');
    if (itemRow) {
      itemRow.style.display = mode === 'item' ? 'block' : 'none';
    }
    var labels = document.getElementById('labels');
    if (mode === 'free') {
      if (!/FREE/i.test(labels.value)) {
        labels.value = labels.value ? ('FREE, ' + labels.value.replace(/^\s*(VIP|GIÁ RIÊNG)\s*,?\s*/i, '')) : 'FREE';
      }
    } else if (mode === 'vip') {
      labels.value = labels.value ? ('VIP, ' + labels.value.replace(/^\s*(FREE|GIÁ RIÊNG)\s*,?\s*/i, '')) : 'VIP';
    } else if (mode === 'item') {
      labels.value = labels.value ? ('GIÁ RIÊNG, ' + labels.value.replace(/^\s*(FREE|VIP)\s*,?\s*/i, '')) : 'GIÁ RIÊNG';
    }
    }
    if (mode === 'paid' && !/VIP/i.test(labels.value)) {
      labels.value = labels.value ? ('VIP, ' + labels.value.replace(/^\s*FREE\s*,?\s*/i, '')) : 'VIP';
    }
  }

  function showApp() {
    gate.classList.add('hidden');
    gate.setAttribute('hidden', 'true');
    gate.style.display = 'none';
    app.classList.remove('hidden');
    app.removeAttribute('hidden');
    app.style.display = '';
    restoreDraft();
    renderPreview();
  }

  function showGate() {
    clearToken();
    app.classList.add('hidden');
    app.setAttribute('hidden', 'true');
    app.style.display = 'none';
    gate.classList.remove('hidden');
    gate.removeAttribute('hidden');
    gate.style.display = '';
    clearGateStatus();
  }

  function clearGateStatus() {
    gateStatus.textContent = '';
    gateStatus.className = 'status hidden';
    gateStatus.setAttribute('hidden', 'true');
  }

  document.getElementById('btnUnlockAdmin').addEventListener('click', function () {
    var password = tokenInput.value.trim();
    if (!password) {
      gateStatus.removeAttribute('hidden');
      setStatus(gateStatus, 'Nhập mật khẩu.', 'err');
      return;
    }
    var btn = document.getElementById('btnUnlockAdmin');
    btn.disabled = true;
    gateStatus.removeAttribute('hidden');
    setStatus(gateStatus, 'Đang xác thực…', 'warn');
    fetch(API_BASE + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
          setStatus(gateStatus, (res.j && res.j.error) || 'Sai mật khẩu.', 'err');
          return;
        }
        saveToken(res.j.token);
        tokenInput.value = '';
        clearGateStatus();
        showApp();
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(gateStatus, 'Không kết nối được api.mmo.wiki.', 'err');
      });
  });

  document.getElementById('btnLogout').addEventListener('click', showGate);

  Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
    btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); persistDraft(); renderPreview(); });
  });

  function setBodyTab(tab) {

      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });

      pane.classList.toggle('hidden', !on);
      if (on) pane.removeAttribute('hidden');
      else pane.setAttribute('hidden', 'true');

  Array.prototype.forEach.call(document.querySelectorAll('#bodyTabSeg button'), function (btn) {
    btn.addEventListener('click', function () { setBodyTab(btn.getAttribute('data-tab')); });
  });

  var SECTION_KEY = 'qcx_admin_section_v1';
  function setComposeSection(section) {
    var next = section || 'meta';
    if (['meta', 'ai', 'body', 'vault'].indexOf(next) < 0) next = 'meta';
    Array.prototype.forEach.call(document.querySelectorAll('#composeNav [data-section]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-section') === next);

      setComposeSection(btn.getAttribute('data-section'));

    setComposeSection(saved || 'meta');
  })();

  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { renderPreview(); }, 280);
  }

  ['title', 'slug', 'labels', 'hero', 'videoUrl', 'teaser', 'locked', 'driveUrl', 'notesHtml', 'price'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', function () {
      if (id === 'title' && !document.getElementById('slug').dataset.touched) {
        document.getElementById('slug').value = slugify(document.getElementById('title').value);
      }
      if (id === 'labels') syncLabelChips();
      persistDraft();
      schedulePreview();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#labelChips [data-label]'), function (btn) {
    btn.addEventListener('click', function () {
      var tag = (btn.getAttribute('data-label') || '').trim();
      if (!tag) return;
      var labelsEl = document.getElementById('labels');
      var parts = String(labelsEl.value || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var idx = -1;
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].toLowerCase() === tag.toLowerCase()) { idx = i; break; }
      }
      if (idx >= 0) parts.splice(idx, 1);
      else parts.push(tag);
      labelsEl.value = parts.join(', ');
      syncLabelChips();
      persistDraft();
      schedulePreview();
    });
  });
  syncLabelChips();
  document.getElementById('slug').addEventListener('input', function () {
    this.dataset.touched = '1';
  });

  function setAiExpanded(open) {
    var box = document.getElementById('aiBox');
    var wrap = document.getElementById('aiBriefWrap');
    var toggle = document.getElementById('btnAiToggle');
    box.classList.toggle('collapsed', !open);
    if (open) {
      wrap.removeAttribute('hidden');
      wrap.classList.remove('hidden');
    } else {
      wrap.setAttribute('hidden', 'true');
      wrap.classList.add('hidden');
    }
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.textContent = open ? 'Brief ▾' : 'Brief ▸';
  }

  document.getElementById('btnAiToggle').addEventListener('click', function () {
    setAiExpanded(document.getElementById('aiBox').classList.contains('collapsed'));
  });

  document.getElementById('btnMore').addEventListener('click', function () {
    var menu = document.getElementById('moreMenu');
    var open = menu.hasAttribute('hidden') || menu.classList.contains('hidden');
    if (open) {
      menu.removeAttribute('hidden');
      menu.classList.remove('hidden');
    } else {
      menu.setAttribute('hidden', 'true');
      menu.classList.add('hidden');
    }
  });

  function setSourceOpen(open) {
    if (open) {
      htmlOut.classList.remove('collapsed', 'hidden');
      htmlOut.removeAttribute('hidden');
      document.getElementById('btnToggleSource').textContent = 'Ẩn source';
    } else {
      htmlOut.classList.add('collapsed', 'hidden');
      htmlOut.setAttribute('hidden', 'true');
      document.getElementById('btnToggleSource').textContent = 'Source';
    }
  }

  document.getElementById('btnToggleSource').addEventListener('click', function () {
    setSourceOpen(htmlOut.classList.contains('hidden') || htmlOut.hasAttribute('hidden'));
  });

  document.getElementById('btnAiGen').addEventListener('click', function () {
    var brief = (document.getElementById('aiBrief').value || '').trim();
    if (brief.length < 8) {
      setComposeSection('ai');
      setAiExpanded(true);
      setStatus(appStatus, 'Brief AI cần ≥ 8 ký tự.', 'err');
      return;
    }
    var token = readToken();
    if (!token) { showGate(); return; }
    var btn = document.getElementById('btnAiGen');
    var model = document.getElementById('aiModel').value;
    btn.disabled = true;
    setStatus(appStatus, 'AI đang gen (' + model + ')…', 'warn');
    fetch(API_BASE + '/api/admin/generate', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        brief: brief,
        mode: mode,
        model: model,
        titleHint: document.getElementById('title').value || undefined
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok) {
          setStatus(appStatus, (res.j && res.j.error) || 'AI gen thất bại.', 'err');
          return;
        }
        var j = res.j;
        if (j.title) document.getElementById('title').value = j.title;
        if (j.slug) {
          document.getElementById('slug').value = j.slug;
          document.getElementById('slug').dataset.touched = '1';
        }
        if (j.labelsCsv) document.getElementById('labels').value = j.labelsCsv;
        else if (j.labels && j.labels.join) document.getElementById('labels').value = j.labels.join(', ');
        if (j.teaserHtml) document.getElementById('teaser').value = j.teaserHtml;
        if (j.lockedHtml) document.getElementById('locked').value = j.lockedHtml;
        persistDraft();
        renderPreview();
        setComposeSection('body');
        setBodyTab('teaser');
        setAiExpanded(false);
        setStatus(appStatus, 'AI OK · đã điền form. Điền Drive rồi Lưu vault.', 'ok');
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(appStatus, 'Không gọi được /api/admin/generate.', 'err');
      });
  });

  document.getElementById('btnPreview').addEventListener('click', function () {
    var check = renderPreview();
    setSourceOpen(true);
    document.getElementById('moreMenu').setAttribute('hidden', 'true');
    document.getElementById('moreMenu').classList.add('hidden');
    setStatus(appStatus, check.ok ? 'HTML contract OK.' : check.errors.join('\n'), check.ok ? 'ok' : 'err');
  });

  document.getElementById('btnCopy').addEventListener('click', function () {
    var check = renderPreview();
    if (!check.ok) {
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    navigator.clipboard.writeText(check.html).then(function () {
      setStatus(appStatus, 'Đã copy HTML body.', 'ok');
    }).catch(function () {
      setStatus(appStatus, 'Copy thất bại — chọn text trong preview.', 'warn');
    });
  });

  document.getElementById('btnVault').addEventListener('click', function () {
    var data = collectForm();
    var check = validate(data, true);
    renderPreview();
    if (!check.ok) {
      var err0 = (check.errors && check.errors[0]) || '';
      if (/drive/i.test(err0)) setComposeSection('vault');
      else if (/title|slug|resourceId|price|Paid/i.test(err0)) setComposeSection('meta');
      else if (/locked|Teaser|HTML|Drive —/i.test(err0)) setComposeSection('body');
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    var token = readToken();
    if (!token) {
      showGate();
      return;
    }
    var vaultDriveUrl = data.driveUrl;
    var vaultNotesHtml = data.notesHtml || '';
    if (vaultDriveUrl && !/^https:\/\/(?:drive|docs)\.google\.com\//i.test(vaultDriveUrl)) {
      if (vaultNotesHtml.indexOf(vaultDriveUrl) < 0) {
        vaultNotesHtml = (vaultNotesHtml ? (vaultNotesHtml + '\n') : '') +
          '<p><a href="' + escapeAttr(vaultDriveUrl) + '" target="_blank" rel="noopener noreferrer">' +
          escapeAttr(vaultDriveUrl) + '</a></p>';
      }
      vaultDriveUrl = 'https://drive.google.com/drive/folders/mmo-' + data.resourceId;
    }
    var body = {
      mode: data.mode,
      title: data.title,
      driveUrl: vaultDriveUrl,
      notesHtml: vaultNotesHtml || undefined
    };
    if (data.mode === 'paid') body.price = data.price;

    setStatus(appStatus, 'Đang PUT vault…');
    fetch(API_BASE + '/api/admin/resources/' + encodeURIComponent(data.resourceId), {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var parsed = null;
        try { parsed = JSON.parse(text); } catch (e) {}
        if (!res.ok) {
          throw new Error((parsed && (parsed.error || parsed.message)) || ('HTTP ' + res.status + ' ' + text.slice(0, 180)));
        }
        setStatus(appStatus, 'Vault OK · resourceId=' + data.resourceId, 'ok');
      });
    }).catch(function (err) {
      setStatus(appStatus, 'Vault lỗi: ' + (err && err.message ? err.message : err), 'err');
    });
  });

  function buildPayload() {
    var data = collectForm();
    var check = validate(data, false);
    return {
      blogId: BLOG_ID,
      title: data.title,
      labels: data.labels,
      customSlug: data.resourceId,
      resourceId: data.resourceId,
      mode: data.mode,
      price: data.price,
      hero: data.hero || undefined,
      videoUrl: data.videoUrl || undefined,
      html: check.html,
      driveUrl: data.driveUrl,
      notesHtml: data.notesHtml,
      createdAt: new Date().toISOString(),
      validation: check
    };
  }

  document.getElementById('btnPayload').addEventListener('click', function () {
    var payload = buildPayload();
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qcx-publish-' + payload.resourceId + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(appStatus, 'Đã tải payload JSON cho _publish_blogger_post.py', 'ok');
  });

  function extractPartsFromHtml(rawHtml) {
    var out = { hero: '', videoUrl: '', teaser: '', locked: '', resourceId: '', mode: '', price: '', title: '' };
    if (!rawHtml || typeof DOMParser === 'undefined') return out;
    try {
      var doc = new DOMParser().parseFromString(String(rawHtml), 'text/html');
      var videoEl = doc.querySelector('.mac-frame-video video');
      if (videoEl) {
        if (videoEl.getAttribute('src')) out.videoUrl = videoEl.getAttribute('src').trim();
        if (videoEl.getAttribute('poster')) out.hero = videoEl.getAttribute('poster').trim();
      }
      var heroImg = doc.querySelector('.mac-frame-image img') || doc.querySelector('img[src]');
      if (!out.hero && heroImg && heroImg.getAttribute('src')) out.hero = heroImg.getAttribute('src').trim();
      var teaserEl = doc.querySelector('.qcx-teaser');
      if (teaserEl) out.teaser = teaserEl.innerHTML.trim();
      var lockedEl = doc.querySelector('.qcx-content-unlock');
      if (lockedEl) out.locked = lockedEl.innerHTML.trim();
      var markerEl = doc.querySelector('#qcx-resource, .qcx-resource-marker');
      if (markerEl) {
        out.resourceId = (markerEl.getAttribute('data-resource-id') || '').trim();
        out.mode = (markerEl.getAttribute('data-mode') || '').trim();
        out.price = (markerEl.getAttribute('data-price') || '').trim();
        out.title = (markerEl.getAttribute('data-title') || '').trim();
      }
    } catch (e) {}
    return out;
  }

  function importPayloadObject(j) {
    if (!j || typeof j !== 'object') {
      setStatus(appStatus, 'JSON không hợp lệ.', 'err');
      return false;
    }
    var parts = extractPartsFromHtml(j.html || '');
    var nextMode = ((j.mode || parts.mode || 'free') + '').toLowerCase() === 'paid' ? 'paid' : 'free';
    var nextTitle = (j.title || parts.title || '').trim();
    var nextSlug = (j.resourceId || j.customSlug || j.slug || parts.resourceId || '').trim();
    var nextLabels = Array.isArray(j.labels) ? j.labels.join(', ') : (j.labelsCsv || j.labels || '');
    var nextHero = (j.hero || parts.hero || '').trim();
    var nextVideo = (j.videoUrl || parts.videoUrl || '').trim();
    var nextTeaser = (j.teaserHtml || j.teaser || parts.teaser || '').trim();
    var nextLocked = (j.lockedHtml || j.locked || parts.locked || '').trim();
    var nextDrive = (j.driveUrl || '').trim();
    var nextNotes = (j.notesHtml || '').trim();
    var nextPrice = (j.price || parts.price || '').trim();

    document.getElementById('title').value = nextTitle;
    document.getElementById('slug').value = nextSlug || slugify(nextTitle);
    document.getElementById('slug').dataset.touched = nextSlug ? '1' : '';
    document.getElementById('labels').value = nextLabels;
    document.getElementById('hero').value = nextHero;
    var videoInput = document.getElementById('videoUrl');
    if (videoInput) videoInput.value = nextVideo;
    document.getElementById('teaser').value = nextTeaser;
    document.getElementById('locked').value = nextLocked;
    document.getElementById('driveUrl').value = nextDrive;
    document.getElementById('notesHtml').value = nextNotes;
    priceEl.value = nextPrice;
    setMode(nextMode);
    persistDraft();
    var check = renderPreview();
    setComposeSection(nextDrive ? 'meta' : 'vault');
    setStatus(
      appStatus,
      check.ok
        ? ('Đã nạp JSON: ' + (nextSlug || nextTitle) + (nextDrive ? ' · Bấm Lưu vault để đồng bộ Worker.' : ' · Điền Drive URL rồi bấm Lưu vault.'))
        : ('Đã nạp JSON nhưng còn thiếu: ' + check.errors.join('; ')),
      check.ok ? 'ok' : 'warn'
    );
    return check.ok;
  }
  window.__qcxAdminImportPayload = importPayloadObject;

  var btnImportJson = document.getElementById('btnImportJson');
  var importJsonInput = document.getElementById('importJsonInput');
  if (btnImportJson && importJsonInput) {
    btnImportJson.addEventListener('click', function () {
      importJsonInput.value = '';
      importJsonInput.click();
    });
    importJsonInput.addEventListener('change', function () {
      var file = importJsonInput.files && importJsonInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          importPayloadObject(parsed);
        } catch (err) {
          setStatus(appStatus, 'Lỗi đọc JSON: ' + (err && err.message ? err.message : err), 'err');
        }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  document.getElementById('btnPublishHint').addEventListener('click', function () {
    var payload = buildPayload();
    renderPreview();
    document.getElementById('moreMenu').setAttribute('hidden', 'true');
    document.getElementById('moreMenu').classList.add('hidden');
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    try {
      localStorage.setItem('qcx_publish_payload_v1', JSON.stringify(payload));
    } catch (e) {}
    var editorListUrl = 'https://www.blogger.com/blog/posts/' + BLOG_ID;
    var msgBase =
      'Sẵn sàng đăng (' + payload.resourceId + '):\n' +
      '1) Nhớ bấm Lưu vault trước\n' +
      '2) Trong Blogger: Bài đăng mới -> Chế độ xem HTML -> Dán body\n' +
      '3) Nhãn: ' + payload.labels.join(', ') + ' · Liên kết cố định tùy chỉnh: ' + payload.resourceId;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload.html).then(function () {
        try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
        setStatus(appStatus, 'Đã copy HTML chuẩn & mở Blogger!\n' + msgBase, 'ok');
      }).catch(function () {
        try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
        setStatus(appStatus, 'Đã mở Blogger (hãy bấm Copy để lấy HTML).\n' + msgBase, 'warn');
      });
    } else {
      try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
      setStatus(appStatus, msgBase, 'warn');
    }
  });

  /* Smart Format Crawl Controller */
  var modalSmartCrawl = document.getElementById('modalSmartCrawl');
  var btnOpenSmartCrawl = document.getElementById('btnOpenSmartCrawl');
  var btnCloseSmartCrawl = document.getElementById('btnCloseSmartCrawl');
  var btnCancelSmartCrawl = document.getElementById('btnCancelSmartCrawl');
  var btnExecuteSmartCrawl = document.getElementById('btnExecuteSmartCrawl');
  var smartCrawlInput = document.getElementById('smartCrawlInput');
  var smartCrawlHero = document.getElementById('smartCrawlHero');
  var smartCrawlAutoLock = document.getElementById('smartCrawlAutoLock');
  var smartCrawlCleanSpam = document.getElementById('smartCrawlCleanSpam');

  function openSmartCrawlModal() {
    if (modalSmartCrawl) {
      modalSmartCrawl.removeAttribute('hidden');
      modalSmartCrawl.classList.remove('hidden');
      if (smartCrawlInput) smartCrawlInput.focus();
    }
  }

  function closeSmartCrawlModal() {
    if (modalSmartCrawl) {
      modalSmartCrawl.setAttribute('hidden', 'true');
      modalSmartCrawl.classList.add('hidden');
    }
  }

  if (btnOpenSmartCrawl) btnOpenSmartCrawl.addEventListener('click', openSmartCrawlModal);
  if (btnCloseSmartCrawl) btnCloseSmartCrawl.addEventListener('click', closeSmartCrawlModal);
  if (btnCancelSmartCrawl) btnCancelSmartCrawl.addEventListener('click', closeSmartCrawlModal);

  function executeSmartCrawl() {
    var rawText = (smartCrawlInput && smartCrawlInput.value || '').trim();
    if (!rawText) {
      alert('Vui lòng dán nội dung bài viết thô vào ô nhập.');
      return;
    }
    var customHero = (smartCrawlHero && smartCrawlHero.value || '').trim();
    var doAutoLock = smartCrawlAutoLock ? smartCrawlAutoLock.checked : true;
    var doCleanSpam = smartCrawlCleanSpam ? smartCrawlCleanSpam.checked : true;

    var lines = rawText.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;

    var cleanedLines = [];
    var detectedHero = customHero || '';
    var detectedDrive = '';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!detectedHero) {
        var imgMatch = line.match(/(https?:\/\/[^\s"'<>]+\.(?:png|jpg|jpeg|webp))/i);
        if (imgMatch) {
          detectedHero = imgMatch[1];
          continue;
        }
      }
      var driveMatch = line.match(/(https?:\/\/drive\.google\.com\/[^\s"'<>]+)/i);
      if (driveMatch) {
        detectedDrive = driveMatch[1];
      }
      if (doCleanSpam) {
        if (/nghientrick|nghiện trick|#nghientrickvn|bot mua gói|verry gemini|mua gói|join channel|kênh telegram|tham gia nhóm/i.test(line) && !/bước|link|hướng dẫn/i.test(line)) {
          continue;
        }
      }
      cleanedLines.push(line);
    }

    if (!cleanedLines.length) {
      alert('Không tìm thấy nội dung hợp lệ sau khi lọc.');
      return;
    }

    var title = cleanedLines[0].replace(/^[#*-\s]+/, '').replace(/[*_#]+/g, '').trim();
    var slug = slugify(title);

    var splitIndex = -1;
    if (doAutoLock) {
      for (var j = 1; j < cleanedLines.length; j++) {
        var l = cleanedLines[j];
        if (/^(bước|step|\d+\.|\*|hướng dẫn|link tải|tải về|cách làm|download|code|tài khoản|cookie|lưu ý|chú ý)/i.test(l)) {
          splitIndex = j;
          break;
        }
      }
    }
    if (splitIndex === -1) {
      splitIndex = Math.min(2, cleanedLines.length);
    }

    var teaserLines = cleanedLines.slice(1, splitIndex);
    if (!teaserLines.length && cleanedLines.length > 1) {
      teaserLines = [cleanedLines[1]];
      splitIndex = 2;
    }
    var teaserHtml = teaserLines.map(function(t) { return '<p>' + escapeHtml(t) + '</p>'; }).join('\n');

    var lockedLines = cleanedLines.slice(splitIndex);
    var lockedHtmlArr = [];
    var inList = false;

    for (var k = 0; k < lockedLines.length; k++) {
      var item = lockedLines[k];
      var formattedItem = item.replace(/(https?:\/\/[^\s"'<>]+)/g, function(url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      });

      if (/^(bước\s*\d+|step\s*\d+|\d+\.)/i.test(item)) {
        if (!inList) {
          lockedHtmlArr.push('<ul>');
          inList = true;
        }
        var match = item.match(/^(bước\s*\d+|step\s*\d+|\d+\.)[:.-]?/i);
        var stepLabel = match ? match[0] : '';
        var stepContent = formattedItem.slice(stepLabel.length).trim();
        lockedHtmlArr.push('  <li><strong>' + stepLabel + '</strong> ' + stepContent + '</li>');
      } else {
        if (inList) {
          lockedHtmlArr.push('</ul>');
          inList = false;
        }
        if (/^(lưu ý|chú ý|note):?/i.test(item)) {
          lockedHtmlArr.push('<h3>' + formattedItem + '</h3>');
        } else if (/^(link|tải về|download):?/i.test(item)) {
          lockedHtmlArr.push('<p><strong>' + formattedItem + '</strong></p>');
        } else {
          lockedHtmlArr.push('<p>' + formattedItem + '</p>');
        }
      }
    }
    if (inList) lockedHtmlArr.push('</ul>');

    var lockedHtml = lockedHtmlArr.join('\n');

    var labels = ['Tutorial'];
    var fullText = rawText.toLowerCase();
    if (/ai|gemini|gpt|claude|deepseek|midjourney/i.test(fullText)) labels.push('AI');
    if (/gemini/i.test(fullText)) labels.push('Gemini');
    if (/chatgpt|gpt/i.test(fullText)) labels.push('ChatGPT');
    if (/tool|phần mềm|cài đặt|setup|script|automation/i.test(fullText)) labels.push('Tools');
    if (/capcut/i.test(fullText)) labels.push('CapCut');
    if (/google/i.test(fullText)) labels.push('Google');

    var payload = {
      title: title,
      slug: slug,
      resourceId: slug,
      hero: detectedHero,
      teaser: teaserHtml,
      locked: lockedHtml,
      labels: labels.join(', '),
      driveUrl: detectedDrive,
      mode: 'free'
    };

    importPayloadObject(payload);
    closeSmartCrawlModal();
    setComposeSection('body');
    setStatus(appStatus, '⚡ Đã chuyển đổi thành công bài viết theo chuẩn Pro Blog MMO!', 'ok');
  }

  if (btnExecuteSmartCrawl) btnExecuteSmartCrawl.addEventListener('click', executeSmartCrawl);

  if (readToken()) showApp();
  else clearGateStatus();
})();
  
</script>

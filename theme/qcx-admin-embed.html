        </div>

    </section>

(function () {

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function readToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function saveToken(token) {
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  }

  function clearToken() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function slugify(value) {
    return String(value || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/đ/g, 'd')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80);
  }

  function escapeAttr(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /** Blogger/Google image CDN hosts used by Blogspot posts. */
  function isBloggerImageHost(url) {
    try {
      var host = new URL(String(url || ''), location.href).hostname.toLowerCase();
      if (host === 'blogger.googleusercontent.com') return true;
      if (/\.bp\.blogspot\.com$/.test(host) || host === 'bp.blogspot.com') return true;
      if (/^lh\d*\.googleusercontent\.com$/.test(host)) return true;
      return false;
    } catch (e) {
      return false;
    }
  }

  /**
   * Replace Blogspot size token in a CDN URL.
   * Shapes: /s1600/file.jpg | /=s1600 | /w640-h360-p-k-no-nu/file.jpg
   * Non-CDN URLs are returned unchanged.
   */
  function withBloggerSize(url, token) {
    var raw = String(url || '').trim();
    var size = String(token || 's1600').replace(/^\/+|\/+$/g, '');
    if (!raw || !isBloggerImageHost(raw)) return raw;
    try {
      var u = new URL(raw, location.href);
      var path = u.pathname;
      // /img/b/.../s####/name  or  /img/b/.../w#-h#-…/name
      if (/\/(?:s\d+(?:-[a-z0-9]+)*)\//i.test(path) || /\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i.test(path)) {
        path = path
          .replace(/\/(?:s\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/')
          .replace(/\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/');
      } else if (/=s\d+(?:-[a-z0-9]+)*/i.test(path) || /=[wh]\d+(?:-[a-z0-9]+)*/i.test(path)) {
        // /img/a/HASH=s1600  or =w640-h360-…
        path = path
          .replace(/=s\d+(?:-[a-z0-9]+)*/i, '=' + size)
          .replace(/=[wh]\d+(?:-[a-z0-9]+)*/i, '=' + size);
      } else if (/\/s\d+(?:-[a-z0-9]+)*$/i.test(path) || /\/[wh]\d+(?:-[a-z0-9]+)*$/i.test(path)) {
        path = path
          .replace(/\/s\d+(?:-[a-z0-9]+)*$/i, '/' + size)
          .replace(/\/[wh]\d+(?:-[a-z0-9]+)*$/i, '/' + size);
      } else {
        // No size segment — insert before filename if path has a trailing file
        path = path.replace(/\/([^\/]+)$/, '/' + size + '/$1');
      }
      u.pathname = path;
      return u.toString();
    } catch (e) {
      return raw;
    }
  }

  function normalizeHeroUrl(url) {
    var raw = String(url || '').trim();
    if (!raw) return '';
    if (!isBloggerImageHost(raw)) return raw;
    return withBloggerSize(raw, 's1600');
  }

  function parseLabels(raw, currentMode, price) {
    var parts = String(raw || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var need = currentMode === 'paid' ? 'VIP' : 'FREE';
    var hasNeed = parts.some(function (p) { return p.toUpperCase() === need; });
    if (!hasNeed) parts.unshift(need);
    if (currentMode === 'paid' && price) {
      var hasPrice = parts.some(function (p) { return p === price; });
      if (!hasPrice) parts.push(price);
    }
    return parts;
  }

  function collectForm() {
    var title = document.getElementById('title').value.trim();
    var slug = document.getElementById('slug').value.trim() || slugify(title);
    var price = priceEl.value.trim();
    var labels = parseLabels(document.getElementById('labels').value, mode, price);
    var heroRaw = document.getElementById('hero').value.trim();
    var hero = normalizeHeroUrl(heroRaw);
    return {
      title: title,
      slug: slug,
      resourceId: slug,
      mode: mode,
      price: price,
      labels: labels,
      hero: hero,
      heroRaw: heroRaw,
      heroIsCdn: !heroRaw || isBloggerImageHost(heroRaw),
      teaser: document.getElementById('teaser').value.trim(),

      driveUrl: document.getElementById('driveUrl').value.trim(),
      notesHtml: document.getElementById('notesHtml').value.trim(),
      blogId: BLOG_ID

  }

  function buildPostHtml(data) {
    var parts = [];
    if (data.hero) {
      var heroSrc = normalizeHeroUrl(data.hero);
      parts.push(
        '<div class="mac-frame mac-frame-image mac-orient-portrait">' +
        '<div class="mac-frame-header"><div class="mac-dots">' +
        '<span class="mac-dot mac-red"></span><span class="mac-dot mac-yellow"></span><span class="mac-dot mac-green"></span>' +

        '</div>'
      );
    }
    if (data.teaser) parts.push('<div class="qcx-teaser">\n' + data.teaser + '\n</div>');

    var marker =
      '<div id="qcx-resource" class="qcx-resource-marker" data-mode="' + escapeAttr(data.mode) + '"' +
      ' data-resource-id="' + escapeAttr(data.resourceId) + '"' +
      ' data-title="' + escapeAttr(data.title) + '"' +
      (data.mode === 'paid' && data.price ? ' data-price="' + escapeAttr(data.price) + '"' : '') +
      ' style="display:none!important">resource:' + escapeAttr(data.resourceId) + '</div>';
    parts.push(marker);

    var locked = data.locked || '<!-- locked content -->';
    parts.push('<div class="container"><div class="qcx-content-unlock" style="display:none">\n' + locked + '\n</div></div>');
    return parts.join('\n\n');
  }

  function validate(data, forVault) {
    var errors = [];
    if (!data.title) errors.push('Thiếu title');
    if (!data.resourceId) errors.push('Thiếu slug/resourceId');
    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.resourceId)) {
      errors.push('resourceId chỉ dùng a-z 0-9 và dấu gạch ngang');
    }
    if (!data.locked) errors.push('Thiếu locked HTML');
    if (forVault && !data.driveUrl) errors.push('Thiếu driveUrl cho vault');
    if (data.mode === 'paid' && !data.price) errors.push('Paid cần price');
    var html = buildPostHtml(data);
    if (/drive\.google\.com/i.test(html)) errors.push('HTML body không được chứa drive.google.com');
    if (/drive\.google\.com/i.test(data.teaser + data.locked)) {
      errors.push('Teaser/locked chứa Drive — chuyển sang vault');
    }
    return { ok: !errors.length, errors: errors, html: html };
  }

      '<span class="tick" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span>' +

      '</li>';

      checkItem(titleOk, 'Title', titleOk ? data.title.slice(0, 48) : 'Thiếu'),
      checkItem(slugOk, 'Slug', slugOk ? data.resourceId : (data.resourceId || '—')),
      checkItem(data.mode === 'free' || !!data.price, 'Mode', modeDetail),
      checkItem(labelsOk, 'Labels', labelsOk ? data.labels.join(', ') : '—'),
      checkItem(teaserOk, 'Teaser', teaserOk ? 'có' : 'trống'),
      checkItem(lockedOk, 'Locked', lockedOk ? 'có' : 'Thiếu'),
      checkItem(driveOk, 'Drive', driveOk ? 'vault' : 'chưa'),
      checkItem(noDriveInHtml, 'No Drive in HTML', noDriveInHtml ? 'ok' : 'lỗi')
    ];
    if (data.heroRaw) {
      items.push(checkItem(data.heroIsCdn, 'Hero CDN', data.heroIsCdn ? 'Blogspot' : 'không phải CDN'));
    }
    previewMeta.innerHTML = items.join('');
    return check;
  }

  function persistDraft() {
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(collectForm())); } catch (e) {}
  }

  function restoreDraft() {
    try {
      var raw = sessionStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      document.getElementById('title').value = d.title || '';
      document.getElementById('slug').value = d.slug || d.resourceId || '';
      document.getElementById('labels').value = (d.labels || []).join(', ');
      document.getElementById('hero').value = d.hero || '';
      document.getElementById('teaser').value = d.teaser || '';
      document.getElementById('locked').value = d.locked || '';
      document.getElementById('driveUrl').value = d.driveUrl || '';
      document.getElementById('notesHtml').value = d.notesHtml || '';
      priceEl.value = d.price || '';
      setMode(d.mode === 'paid' ? 'paid' : 'free');
    } catch (e) {}
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
    var paid = mode === 'paid';
    priceEl.disabled = !paid;
    var priceField = document.getElementById('priceField');
    if (priceField) {
      priceField.hidden = !paid;
      priceField.classList.toggle('hidden', !paid);
    }
    var labels = document.getElementById('labels');
    if (mode === 'free' && !/FREE/i.test(labels.value)) {
      labels.value = labels.value ? ('FREE, ' + labels.value.replace(/^\s*VIP\s*,?\s*/i, '')) : 'FREE';
    }
    if (mode === 'paid' && !/VIP/i.test(labels.value)) {
      labels.value = labels.value ? ('VIP, ' + labels.value.replace(/^\s*FREE\s*,?\s*/i, '')) : 'VIP';
    }
  }

  function showApp() {
    gate.classList.add('hidden');
    gate.setAttribute('hidden', 'true');
    gate.style.display = 'none';
    app.classList.remove('hidden');
    app.removeAttribute('hidden');
    app.style.display = '';
    restoreDraft();
    renderPreview();
  }

  function showGate() {
    clearToken();
    app.classList.add('hidden');
    app.setAttribute('hidden', 'true');
    app.style.display = 'none';
    gate.classList.remove('hidden');
    gate.removeAttribute('hidden');
    gate.style.display = '';
    clearGateStatus();
  }

  function clearGateStatus() {
    gateStatus.textContent = '';
    gateStatus.className = 'status hidden';
    gateStatus.setAttribute('hidden', 'true');
  }

  document.getElementById('btnUnlockAdmin').addEventListener('click', function () {
    var password = tokenInput.value.trim();
    if (!password) {
      gateStatus.removeAttribute('hidden');
      setStatus(gateStatus, 'Nhập mật khẩu.', 'err');
      return;
    }
    var btn = document.getElementById('btnUnlockAdmin');
    btn.disabled = true;
    gateStatus.removeAttribute('hidden');
    setStatus(gateStatus, 'Đang xác thực…', 'warn');
    fetch(API_BASE + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
          setStatus(gateStatus, (res.j && res.j.error) || 'Sai mật khẩu.', 'err');
          return;
        }
        saveToken(res.j.token);
        tokenInput.value = '';
        clearGateStatus();
        showApp();
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(gateStatus, 'Không kết nối được api.timkiem.app.', 'err');
      });
  });

  document.getElementById('btnLogout').addEventListener('click', showGate);

  Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
    btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); persistDraft(); renderPreview(); });
  });

  function setBodyTab(tab) {
    Array.prototype.forEach.call(document.querySelectorAll('#bodyTabSeg button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#bodyTabs .body-pane'), function (pane) {
      var on = pane.getAttribute('data-pane') === tab;
      pane.classList.toggle('hidden', !on);
      if (on) pane.removeAttribute('hidden');
      else pane.setAttribute('hidden', 'true');
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#bodyTabSeg button'), function (btn) {
    btn.addEventListener('click', function () { setBodyTab(btn.getAttribute('data-tab')); });
  });

  var SECTION_KEY = 'qcx_admin_section_v1';
  function setComposeSection(section) {
    var next = section || 'meta';
    if (['meta', 'ai', 'body', 'vault'].indexOf(next) < 0) next = 'meta';
    Array.prototype.forEach.call(document.querySelectorAll('#composeNav [data-section]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-section') === next);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-section-pane]'), function (pane) {
      var on = pane.getAttribute('data-section-pane') === next;
      pane.classList.toggle('hidden', !on);
      if (on) pane.removeAttribute('hidden');
      else pane.setAttribute('hidden', 'true');
    });
    try { sessionStorage.setItem(SECTION_KEY, next); } catch (e) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll('#composeNav [data-section]'), function (btn) {
    btn.addEventListener('click', function () {
      setComposeSection(btn.getAttribute('data-section'));
    });
  });
  (function initComposeSection() {
    var saved = '';
    try { saved = sessionStorage.getItem(SECTION_KEY) || ''; } catch (e) {}
    setComposeSection(saved || 'meta');
  })();

  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { renderPreview(); }, 280);
  }

  ['title', 'slug', 'labels', 'hero', 'teaser', 'locked', 'driveUrl', 'notesHtml', 'price'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      if (id === 'title' && !document.getElementById('slug').dataset.touched) {
        document.getElementById('slug').value = slugify(document.getElementById('title').value);
      }
      persistDraft();
      schedulePreview();
    });
  });
  document.getElementById('slug').addEventListener('input', function () {
    this.dataset.touched = '1';
  });

  function setAiExpanded(open) {
    var box = document.getElementById('aiBox');
    var wrap = document.getElementById('aiBriefWrap');
    var toggle = document.getElementById('btnAiToggle');
    box.classList.toggle('collapsed', !open);
    if (open) {
      wrap.removeAttribute('hidden');
      wrap.classList.remove('hidden');
    } else {
      wrap.setAttribute('hidden', 'true');
      wrap.classList.add('hidden');
    }
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.textContent = open ? 'Brief ▾' : 'Brief ▸';
  }

  document.getElementById('btnAiToggle').addEventListener('click', function () {
    setAiExpanded(document.getElementById('aiBox').classList.contains('collapsed'));
  });

  document.getElementById('btnMore').addEventListener('click', function () {
    var menu = document.getElementById('moreMenu');
    var open = menu.hasAttribute('hidden') || menu.classList.contains('hidden');
    if (open) {
      menu.removeAttribute('hidden');
      menu.classList.remove('hidden');
    } else {
      menu.setAttribute('hidden', 'true');
      menu.classList.add('hidden');
    }
  });

  function setSourceOpen(open) {
    if (open) {
      htmlOut.classList.remove('collapsed', 'hidden');
      htmlOut.removeAttribute('hidden');
      document.getElementById('btnToggleSource').textContent = 'Ẩn source';
    } else {
      htmlOut.classList.add('collapsed', 'hidden');
      htmlOut.setAttribute('hidden', 'true');
      document.getElementById('btnToggleSource').textContent = 'Source';
    }
  }

  document.getElementById('btnToggleSource').addEventListener('click', function () {
    setSourceOpen(htmlOut.classList.contains('hidden') || htmlOut.hasAttribute('hidden'));
  });

  document.getElementById('btnAiGen').addEventListener('click', function () {
    var brief = (document.getElementById('aiBrief').value || '').trim();
    if (brief.length < 8) {
      setComposeSection('ai');
      setAiExpanded(true);
      setStatus(appStatus, 'Brief AI cần ≥ 8 ký tự.', 'err');
      return;
    }
    var token = readToken();
    if (!token) { showGate(); return; }
    var btn = document.getElementById('btnAiGen');
    var model = document.getElementById('aiModel').value;
    btn.disabled = true;
    setStatus(appStatus, 'AI đang gen (' + model + ')…', 'warn');
    fetch(API_BASE + '/api/admin/generate', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        brief: brief,
        mode: mode,
        model: model,
        titleHint: document.getElementById('title').value || undefined
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok) {
          setStatus(appStatus, (res.j && res.j.error) || 'AI gen thất bại.', 'err');
          return;
        }
        var j = res.j;
        if (j.title) document.getElementById('title').value = j.title;
        if (j.slug) {
          document.getElementById('slug').value = j.slug;
          document.getElementById('slug').dataset.touched = '1';
        }
        if (j.labelsCsv) document.getElementById('labels').value = j.labelsCsv;
        else if (j.labels && j.labels.join) document.getElementById('labels').value = j.labels.join(', ');
        if (j.teaserHtml) document.getElementById('teaser').value = j.teaserHtml;
        if (j.lockedHtml) document.getElementById('locked').value = j.lockedHtml;
        persistDraft();
        renderPreview();
        setComposeSection('body');
        setBodyTab('teaser');
        setAiExpanded(false);
        setStatus(appStatus, 'AI OK · đã điền form. Điền Drive rồi Lưu vault.', 'ok');
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(appStatus, 'Không gọi được /api/admin/generate.', 'err');
      });
  });

  document.getElementById('btnPreview').addEventListener('click', function () {
    var check = renderPreview();
    setSourceOpen(true);
    document.getElementById('moreMenu').setAttribute('hidden', 'true');
    document.getElementById('moreMenu').classList.add('hidden');
    setStatus(appStatus, check.ok ? 'HTML contract OK.' : check.errors.join('\n'), check.ok ? 'ok' : 'err');
  });

  document.getElementById('btnCopy').addEventListener('click', function () {
    var check = renderPreview();
    if (!check.ok) {
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    navigator.clipboard.writeText(check.html).then(function () {
      setStatus(appStatus, 'Đã copy HTML body.', 'ok');
    }).catch(function () {
      setStatus(appStatus, 'Copy thất bại — chọn text trong preview.', 'warn');
    });
  });

  document.getElementById('btnVault').addEventListener('click', function () {
    var data = collectForm();
    var check = validate(data, true);
    renderPreview();
    if (!check.ok) {
      var err0 = (check.errors && check.errors[0]) || '';
      if (/drive/i.test(err0)) setComposeSection('vault');
      else if (/title|slug|resourceId|price|Paid/i.test(err0)) setComposeSection('meta');
      else if (/locked|Teaser|HTML|Drive —/i.test(err0)) setComposeSection('body');
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    var token = readToken();
    if (!token) {
      showGate();
      return;
    }
    var vaultDriveUrl = data.driveUrl;
    var vaultNotesHtml = data.notesHtml || '';
    if (vaultDriveUrl && !/^https:\/\/(?:drive|docs)\.google\.com\//i.test(vaultDriveUrl)) {
      if (vaultNotesHtml.indexOf(vaultDriveUrl) < 0) {
        vaultNotesHtml = (vaultNotesHtml ? (vaultNotesHtml + '\n') : '') +
          '<p><a href="' + escapeAttr(vaultDriveUrl) + '" target="_blank" rel="noopener noreferrer">' +
          escapeAttr(vaultDriveUrl) + '</a></p>';
      }
      vaultDriveUrl = 'https://drive.google.com/drive/folders/timkiem-' + data.resourceId;
    }
    var body = {
      mode: data.mode,
      title: data.title,
      driveUrl: vaultDriveUrl,
      notesHtml: vaultNotesHtml || undefined
    };
    if (data.mode === 'paid') body.price = data.price;

    setStatus(appStatus, 'Đang PUT vault…');
    fetch(API_BASE + '/api/admin/resources/' + encodeURIComponent(data.resourceId), {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var parsed = null;
        try { parsed = JSON.parse(text); } catch (e) {}
        if (!res.ok) {
          throw new Error((parsed && (parsed.error || parsed.message)) || ('HTTP ' + res.status + ' ' + text.slice(0, 180)));
        }
        setStatus(appStatus, 'Vault OK · resourceId=' + data.resourceId, 'ok');
      });
    }).catch(function (err) {
      setStatus(appStatus, 'Vault lỗi: ' + (err && err.message ? err.message : err), 'err');
    });
  });

  function buildPayload() {
    var data = collectForm();
    var check = validate(data, false);
    return {
      blogId: BLOG_ID,
      title: data.title,
      labels: data.labels,
      customSlug: data.resourceId,
      resourceId: data.resourceId,
      mode: data.mode,
      price: data.price,
      html: check.html,
      driveUrl: data.driveUrl,
      notesHtml: data.notesHtml,
      createdAt: new Date().toISOString(),
      validation: check
    };
  }

  document.getElementById('btnPayload').addEventListener('click', function () {
    var payload = buildPayload();
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qcx-publish-' + payload.resourceId + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(appStatus, 'Đã tải payload JSON cho _publish_blogger_post.py', 'ok');
  });

  function extractPartsFromHtml(rawHtml) {
    var out = { hero: '', teaser: '', locked: '', resourceId: '', mode: '', price: '', title: '' };
    if (!rawHtml || typeof DOMParser === 'undefined') return out;
    try {
      var doc = new DOMParser().parseFromString(String(rawHtml), 'text/html');
      var heroImg = doc.querySelector('.mac-frame-image img');
      if (heroImg && heroImg.getAttribute('src')) out.hero = heroImg.getAttribute('src').trim();
      var teaserEl = doc.querySelector('.qcx-teaser');
      if (teaserEl) out.teaser = teaserEl.innerHTML.trim();
      var lockedEl = doc.querySelector('.qcx-content-unlock');
      if (lockedEl) out.locked = lockedEl.innerHTML.trim();
      var markerEl = doc.querySelector('#qcx-resource, .qcx-resource-marker');
      if (markerEl) {
        out.resourceId = (markerEl.getAttribute('data-resource-id') || '').trim();
        out.mode = (markerEl.getAttribute('data-mode') || '').trim();
        out.price = (markerEl.getAttribute('data-price') || '').trim();
        out.title = (markerEl.getAttribute('data-title') || '').trim();
      }
    } catch (e) {}
    return out;
  }

  function importPayloadObject(j) {
    if (!j || typeof j !== 'object') {
      setStatus(appStatus, 'JSON không hợp lệ.', 'err');
      return false;
    }
    var parts = extractPartsFromHtml(j.html || '');
    var nextMode = ((j.mode || parts.mode || 'free') + '').toLowerCase() === 'paid' ? 'paid' : 'free';
    var nextTitle = (j.title || parts.title || '').trim();
    var nextSlug = (j.resourceId || j.customSlug || j.slug || parts.resourceId || '').trim();
    var nextLabels = Array.isArray(j.labels) ? j.labels.join(', ') : (j.labelsCsv || j.labels || '');
    var nextHero = (j.hero || parts.hero || '').trim();
    var nextTeaser = (j.teaserHtml || j.teaser || parts.teaser || '').trim();
    var nextLocked = (j.lockedHtml || j.locked || parts.locked || '').trim();
    var nextDrive = (j.driveUrl || '').trim();
    var nextNotes = (j.notesHtml || '').trim();
    var nextPrice = (j.price || parts.price || '').trim();

    document.getElementById('title').value = nextTitle;
    document.getElementById('slug').value = nextSlug || slugify(nextTitle);
    document.getElementById('slug').dataset.touched = nextSlug ? '1' : '';
    document.getElementById('labels').value = nextLabels;
    document.getElementById('hero').value = nextHero;
    document.getElementById('teaser').value = nextTeaser;
    document.getElementById('locked').value = nextLocked;
    document.getElementById('driveUrl').value = nextDrive;
    document.getElementById('notesHtml').value = nextNotes;
    priceEl.value = nextPrice;
    setMode(nextMode);
    persistDraft();
    var check = renderPreview();
    setComposeSection(nextDrive ? 'meta' : 'vault');
    setStatus(
      appStatus,
      check.ok
        ? ('Đã nạp JSON: ' + (nextSlug || nextTitle) + (nextDrive ? ' · Bấm Lưu vault để đồng bộ Worker.' : ' · Điền Drive URL rồi bấm Lưu vault.'))
        : ('Đã nạp JSON nhưng còn thiếu: ' + check.errors.join('; ')),
      check.ok ? 'ok' : 'warn'
    );
    return check.ok;
  }
  window.__qcxAdminImportPayload = importPayloadObject;

  var btnImportJson = document.getElementById('btnImportJson');
  var importJsonInput = document.getElementById('importJsonInput');
  if (btnImportJson && importJsonInput) {
    btnImportJson.addEventListener('click', function () {
      importJsonInput.value = '';
      importJsonInput.click();
    });
    importJsonInput.addEventListener('change', function () {
      var file = importJsonInput.files && importJsonInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          importPayloadObject(parsed);
        } catch (err) {
          setStatus(appStatus, 'Lỗi đọc JSON: ' + (err && err.message ? err.message : err), 'err');
        }
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  document.getElementById('btnPublishHint').addEventListener('click', function () {
    var payload = buildPayload();
    renderPreview();
    document.getElementById('moreMenu').setAttribute('hidden', 'true');
    document.getElementById('moreMenu').classList.add('hidden');
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    try {
      localStorage.setItem('qcx_publish_payload_v1', JSON.stringify(payload));
    } catch (e) {}
    var editorListUrl = 'https://www.blogger.com/blog/posts/' + BLOG_ID;
    var msgBase =
      'Sẵn sàng đăng (' + payload.resourceId + '):\n' +
      '1) Nhớ bấm Lưu vault trước\n' +
      '2) Trong Blogger: Bài đăng mới -> Chế độ xem HTML -> Dán body\n' +
      '3) Nhãn: ' + payload.labels.join(', ') + ' · Liên kết cố định tùy chỉnh: ' + payload.resourceId;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload.html).then(function () {
        try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
        setStatus(appStatus, 'Đã copy HTML chuẩn & mở Blogger!\n' + msgBase, 'ok');
      }).catch(function () {
        try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
        setStatus(appStatus, 'Đã mở Blogger (hãy bấm Copy để lấy HTML).\n' + msgBase, 'warn');
      });
    } else {
      try { window.open(editorListUrl, '_blank', 'noopener'); } catch (e) {}
      setStatus(appStatus, msgBase, 'warn');
    }
  });

  if (readToken()) showApp();
  else clearGateStatus();
})();
  
</script>

<!-- TIMKIEM admin · CSS via runtime #qcx-admin-ui · markup+script only -->
<div id="qcx-admin-root">
  <!-- Admin boot: CDN qcx-layout-rescue ensureAdminBootFromFeed -->
  <div class="wrap">
    <header>
      <h1>TIMKIEM <span>admin</span></h1>
      <button type="button" class="ghost" id="btnLogout">Đăng xuất</button>
    </header>

    <section class="gate" id="gate">
      <h2>Đăng nhập</h2>
      <div class="field">
        <label for="tokenInput">Mật khẩu</label>
        <input id="tokenInput" type="password" autocomplete="current-password" placeholder="nhập mật khẩu" />
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btnUnlockAdmin">Đăng nhập</button>
      </div>
      <div class="status hidden" id="gateStatus" hidden></div>
    </section>

    <section class="grid hidden" id="app" hidden="true" style="display:none!important">
      <div class="panel">
        <div class="panel-head">
          <h2>Soạn bài</h2>
        </div>

        <div class="ai-box" id="aiBox">
          <div class="row">
            <div class="field" style="flex:1;min-width:0">
              <label for="aiBrief">AI brief</label>
              <textarea id="aiBrief" rows="2" placeholder="VD: Hướng dẫn Termux + Ollama + Claude Code trên Android, FREE unlock bằng bình luận…"></textarea>
            </div>
          </div>
          <div class="row ai-row">
            <div class="field">
              <label for="aiModel">Model</label>
              <select id="aiModel">
                <option value="deepseek-v4-flash" selected>deepseek-v4-flash (nhanh)</option>
                <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
                <option value="claude-haiku-4-5-20251001">claude-haiku-4-5</option>
                <option value="claude-opus-4-8">claude-opus-4-8</option>
                <option value="gpt-5.5">gpt-5.5</option>
                <option value="gpt-6-sol">gpt-6-sol</option>
                <option value="grok-4.7">grok-4.7</option>
                <option value="glm-5.3-flash">glm-5.3-flash</option>
                <option value="gemini-3.6-flash-high">gemini-3.6-flash-high</option>
                <option value="MiniMax-M2.7">MiniMax-M2.7</option>
                <option value="kimi-k3">kimi-k3</option>
                <option value="qwen-3.8-max">qwen-3.8-max</option>
                <option value="deepseek/deepseek-v4-pro">deepseek-v4-pro</option>
                <option value="NARWHAL">NARWHAL</option>
              </select>
            </div>
            <div class="field ai-actions">
              <label>&nbsp;</label>
              <button type="button" class="primary" id="btnAiGen">AI Gen → form</button>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" placeholder="Mobile AI Coding Claude Setup Free" />
          </div>
          <div class="field">
            <label for="slug">Slug / resourceId</label>
            <input id="slug" type="text" placeholder="mobile-claude-setup" />
          </div>
        </div>

        <div class="row row-3">
          <div class="field">
            <label>Mode</label>
            <div class="seg" id="modeSeg">
              <button type="button" data-mode="free" class="active">FREE</button>
              <button type="button" data-mode="paid">PAID</button>
            </div>
          </div>
          <div class="field">
            <label for="price">Price</label>
            <input id="price" type="text" placeholder="50.000" disabled />
          </div>
          <div class="field">
            <label for="labels">Labels</label>
            <input id="labels" type="text" placeholder="AI, FREE" />
          </div>
        </div>

        <div class="field">
          <label for="hero">Hero URL</label>
          <input id="hero" type="url" placeholder="https://blogger.googleusercontent.com/..." />
        </div>

        <div class="body-tabs" id="bodyTabs">
          <div class="seg body-tab-seg" id="bodyTabSeg">
            <button type="button" data-tab="teaser" class="active">Teaser</button>
            <button type="button" data-tab="locked">Locked</button>
            <button type="button" data-tab="notes">Notes</button>
          </div>
          <div class="field body-pane" data-pane="teaser">
            <textarea id="teaser" class="tall" placeholder="&lt;p&gt;Lead khi còn khóa…&lt;/p&gt;"></textarea>
          </div>
          <div class="field body-pane hidden" data-pane="locked" hidden>
            <textarea id="locked" class="tall" placeholder="&lt;h2&gt;…&lt;/h2&gt;&lt;p&gt;Sau unlock&lt;/p&gt;"></textarea>
          </div>
          <div class="field body-pane hidden" data-pane="notes" hidden>
            <textarea id="notesHtml" class="tall" placeholder="&lt;p&gt;Hướng dẫn mở file Drive…&lt;/p&gt;"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="driveUrl">Drive URL (vault only)</label>
          <input id="driveUrl" type="url" placeholder="https://drive.google.com/..." />
        </div>

        <div class="actions">
          <button type="button" class="primary" id="btnVault">Lưu vault</button>
          <button type="button" id="btnPreview">Xem HTML</button>
          <button type="button" id="btnCopy">Copy</button>
          <button type="button" id="btnPayload">Payload</button>
          <button type="button" class="ghost" id="btnPublishHint">Đăng?</button>
        </div>
        <div class="status" id="appStatus">Sẵn sàng.</div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Preview</h2>
          <button type="button" class="ghost" id="btnToggleSource">Source</button>
        </div>
        <div class="preview-meta" id="previewMeta"></div>
        <div class="html-out collapsed" id="htmlOut" role="region" aria-label="HTML preview">Nhấn “Xem HTML”.</div>
        <p class="hint publish">Payload → <code>_publish_blogger_post.py</code></p>
      </div>
    </section>
  </div>
  </div>
<script>
/* qcx-admin-boot-script */
(function(){
  var s=document.getElementById('qcx-admin-ui');
  if(!s){
    s=document.createElement('style');
    s.id='qcx-admin-ui';
    s.type='text/css';
    (document.head||document.documentElement).appendChild(s);
  }
  s.textContent="/* qcx-admin-ui */\n/* TIMKIEM Admin \u2014 dense cockpit (PC + mobile) */\n    #qcx-admin-root, #qcx-admin-root * { box-sizing: border-box; }\n    #qcx-admin-root {\n      --qcx-admin-radius: 8px;\n      --qcx-admin-ok: #7dcea0;\n      --qcx-admin-warn: #e0b35a;\n      --qcx-admin-fill: #141a16;\n      --qcx-admin-hover: #1c2420;\n      --qcx-admin-mint: #7dcea0;\n      --qcx-admin-mint-ink: #06110a;\n      --qcx-admin-input: #0b120c;\n      --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;\n      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n      margin: 0 auto;\n      min-height: 0;\n      padding: 0 0 24px;\n      color: var(--fg, #e6f5ec);\n      font: 13px/1.4 var(--sans);\n      -webkit-font-smoothing: antialiased;\n      background: transparent;\n      width: 100%;\n      max-width: 1080px;\n    }\n    #qcx-admin-root .wrap {\n      max-width: 1080px;\n      margin: 0 auto;\n      padding: 6px 12px 24px;\n      width: 100%;\n    }\n\n    /* Login gate: compact card, slightly above center */\n    #qcx-admin-root:has(.gate:not(.hidden)) {\n      min-height: calc(100vh - 64px);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 12px 10px 28px;\n      max-width: none;\n    }\n    #qcx-admin-root:has(.gate:not(.hidden)) .wrap {\n      width: 100%;\n      max-width: 300px;\n      margin: -10vh auto 0;\n      padding: 0;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n    }\n    #qcx-admin-root:has(.gate:not(.hidden)) > .wrap > header,\n    #qcx-admin-root:has(.gate:not(.hidden)) #btnLogout {\n      display: none !important;\n    }\n    #qcx-admin-root:has(.gate:not(.hidden)) .gate {\n      width: 100%;\n      max-width: 300px;\n      margin: 0 auto;\n      padding: 10px 12px;\n    }\n    #qcx-admin-root .gate h2 {\n      margin: 0 0 8px;\n      font: 700 10px/1.2 var(--mono);\n      letter-spacing: 0.1em;\n    }\n    #qcx-admin-root .gate .field { margin-bottom: 8px; }\n    #qcx-admin-root .gate .actions {\n      display: flex;\n      width: 100%;\n      margin-top: 8px;\n      padding-top: 0;\n    }\n    #qcx-admin-root .gate .actions .primary,\n    #qcx-admin-root .gate button.primary {\n      width: 100%;\n      flex: 1 1 auto;\n    }\n    /* Hide login hint; gate status only when not .hidden */\n    #qcx-admin-root .gate > .hint,\n    #qcx-admin-root #gateStatus.hidden {\n      display: none !important;\n    }\n\n    /* Beat theme header kill: display:none + height:0 + overflow:hidden */\n    #qcx-admin-root header {\n      display: flex !important;\n      position: relative !important;\n      height: auto !important;\n      min-height: 0 !important;\n      max-height: none !important;\n      overflow: visible !important;\n      visibility: visible !important;\n      opacity: 1 !important;\n      background: transparent !important;\n      flex-wrap: nowrap;\n      gap: 8px 12px;\n      align-items: center;\n      justify-content: space-between;\n      margin: 0 0 8px !important;\n      padding: 2px 0 6px !important;\n      border: 0 !important;\n      border-bottom: 1px solid var(--line, #1d2a1f) !important;\n    }\n    #qcx-admin-root header h1,\n    #qcx-admin-root header button {\n      position: static !important;\n      height: auto !important;\n      overflow: visible !important;\n      visibility: visible !important;\n      opacity: 1 !important;\n    }\n    #qcx-admin-root header h1 {\n      margin: 0;\n      font: 700 13px/1.2 var(--mono);\n      letter-spacing: 0.04em;\n      text-transform: uppercase;\n      color: var(--fg, #e6f5ec);\n    }\n    #qcx-admin-root header h1 span { color: var(--qcx-admin-mint); }\n    #qcx-admin-root header p { display: none !important; }\n    #qcx-admin-root #btnLogout {\n      min-height: 28px;\n      padding: 4px 10px;\n      font: 600 10px/1 var(--mono);\n      letter-spacing: 0.06em;\n      text-transform: uppercase;\n      flex: 0 0 auto;\n      white-space: nowrap;\n    }\n\n    #qcx-admin-root .gate, #qcx-admin-root .panel {\n      background: linear-gradient(180deg, #101a12 0%, var(--card, #0e170f) 100%);\n      border: 1px solid var(--line, #1d2a1f);\n      border-radius: var(--qcx-admin-radius);\n      padding: 12px;\n      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);\n    }\n    #qcx-admin-root .gate {\n      max-width: 300px; width: 100%; margin: 0 auto;\n      animation: qcx-admin-rise 0.35s ease-out both;\n      padding: 10px 12px;\n    }\n    #qcx-admin-root .gate h2,\n    #qcx-admin-root .panel h2 {\n      margin: 0 0 4px;\n      font: 700 11px/1.2 var(--mono);\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n      color: var(--qcx-admin-mint);\n    }\n    #qcx-admin-root .panel-head {\n      display: flex; align-items: baseline; justify-content: space-between;\n      gap: 8px; margin-bottom: 8px; padding-bottom: 6px;\n      border-bottom: 1px solid var(--line, #1d2a1f);\n    }\n    #qcx-admin-root .panel-head h2 { margin: 0; }\n\n    /* Beat theme `.grid{grid-template-columns:repeat(4,1fr)!important}` */\n    #qcx-admin-root .grid {\n      display: grid !important;\n      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr) !important;\n      gap: 10px !important;\n      animation: qcx-admin-rise 0.35s ease-out both;\n      width: 100%;\n      max-width: 1080px;\n      margin: 0 auto;\n      align-items: start;\n    }\n    #qcx-admin-root .grid.hidden,\n    #qcx-admin-root .hidden { display: none !important; }\n    @media (max-width: 900px) {\n      #qcx-admin-root .grid { grid-template-columns: 1fr !important; }\n    }\n\n    #qcx-admin-root label {\n      display: block; margin: 0 0 4px;\n      color: var(--fg-dim, #8aa596);\n      font: 600 10px/1.15 var(--mono);\n      letter-spacing: 0.06em; text-transform: uppercase;\n    }\n    #qcx-admin-root .field { margin-bottom: 8px; }\n    #qcx-admin-root .row {\n      display: grid !important;\n      grid-template-columns: 1fr 1fr !important;\n      gap: 8px;\n    }\n    #qcx-admin-root .row.row-3 {\n      grid-template-columns: 1fr 0.7fr 1.1fr !important;\n    }\n    @media (max-width: 560px) {\n      #qcx-admin-root .row,\n      #qcx-admin-root .row.row-3 { grid-template-columns: 1fr !important; }\n    }\n\n    #qcx-admin-root .ai-box {\n      margin: 0 0 10px;\n      padding: 8px 10px;\n      border: 1px solid rgba(125, 206, 160, 0.28);\n      border-radius: 8px;\n      background: rgba(125, 206, 160, 0.05);\n    }\n    #qcx-admin-root .ai-box textarea { min-height: 52px; }\n    #qcx-admin-root .ai-row .ai-actions button { width: 100%; }\n\n    #qcx-admin-root .body-tabs { margin-bottom: 8px; }\n    #qcx-admin-root .body-tab-seg { margin-bottom: 6px; }\n    #qcx-admin-root .body-pane.hidden { display: none !important; }\n    #qcx-admin-root .body-pane textarea.tall { min-height: 160px; }\n\n    #qcx-admin-root .html-out.collapsed {\n      max-height: 72px;\n      overflow: hidden;\n      opacity: 0.72;\n    }\n    #qcx-admin-root .panel-head .ghost { margin-left: auto; }\n\n    #qcx-admin-root input,\n    #qcx-admin-root select,\n    #qcx-admin-root textarea {\n      width: 100%;\n      min-height: 34px;\n      background: var(--qcx-admin-input);\n      border: 1px solid #243328;\n      border-radius: 7px;\n      color: var(--fg, #e6f5ec);\n      padding: 7px 10px;\n      font: 500 12.5px/1.35 var(--mono);\n      transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;\n    }\n    #qcx-admin-root textarea { min-height: 72px; resize: vertical; padding-top: 8px; }\n    #qcx-admin-root textarea.tall { min-height: 120px; }\n    #qcx-admin-root input::placeholder,\n    #qcx-admin-root textarea::placeholder {\n      color: #6f8576; opacity: 1; font-weight: 400;\n    }\n    #qcx-admin-root input:hover,\n    #qcx-admin-root select:hover,\n    #qcx-admin-root textarea:hover { border-color: #334539; }\n    #qcx-admin-root input:focus,\n    #qcx-admin-root select:focus,\n    #qcx-admin-root textarea:focus {\n      outline: none;\n      border-color: var(--qcx-admin-mint);\n      box-shadow: 0 0 0 2px rgba(125, 206, 160, 0.16);\n      background: #0d1610;\n    }\n    #qcx-admin-root input:disabled,\n    #qcx-admin-root textarea:disabled {\n      opacity: 0.45; cursor: not-allowed; background: #0a100b;\n    }\n\n    #qcx-admin-root .actions {\n      display: flex; flex-wrap: wrap; gap: 6px;\n      margin-top: 10px; padding-top: 2px;\n    }\n    #qcx-admin-root button,\n    #qcx-admin-root .btn {\n      appearance: none;\n      display: inline-flex; align-items: center; justify-content: center;\n      gap: 6px;\n      min-height: 34px;\n      border: 1px solid #2a3830;\n      background: var(--qcx-admin-fill);\n      color: #e8efe9;\n      border-radius: 7px;\n      padding: 6px 11px;\n      font: 700 11px/1 var(--mono);\n      letter-spacing: 0.03em;\n      cursor: pointer;\n      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;\n    }\n    #qcx-admin-root button:hover {\n      background: var(--qcx-admin-hover);\n      border-color: #3a4a40;\n    }\n    #qcx-admin-root button:active { transform: none; }\n    #qcx-admin-root button.primary {\n      background: var(--qcx-admin-mint);\n      color: var(--qcx-admin-mint-ink);\n      border-color: var(--qcx-admin-mint);\n      box-shadow: none;\n    }\n    #qcx-admin-root button.primary:hover {\n      background: #93dbb2;\n      border-color: #93dbb2;\n      color: var(--qcx-admin-mint-ink);\n    }\n    #qcx-admin-root button.ghost {\n      background: transparent;\n      border-color: #2a3830;\n      color: var(--fg-dim, #8aa596);\n      box-shadow: none;\n      min-height: 30px;\n      padding: 4px 9px;\n      font-size: 10px;\n    }\n    #qcx-admin-root button.ghost:hover {\n      color: var(--fg, #e6f5ec);\n      border-color: var(--qcx-admin-mint);\n      background: rgba(125, 206, 160, 0.06);\n    }\n    #qcx-admin-root button:disabled {\n      opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none;\n    }\n\n    #qcx-admin-root .status {\n      margin-top: 8px; padding: 7px 10px; border-radius: 7px;\n      border: 1px solid var(--line, #1d2a1f);\n      color: var(--fg-dim, #8aa596);\n      font: 11px/1.4 var(--mono);\n      white-space: pre-wrap;\n      background: rgba(10, 15, 10, 0.7);\n    }\n    #qcx-admin-root .status.ok { border-color: rgba(125,206,160,.45); color: var(--qcx-admin-ok); background: rgba(125,206,160,.06); }\n    #qcx-admin-root .status.err { border-color: rgba(255,84,112,.45); color: var(--danger, #ff5470); background: rgba(255,84,112,.06); }\n    #qcx-admin-root .status.warn { border-color: rgba(224,179,90,.45); color: var(--qcx-admin-warn); background: rgba(224,179,90,.06); }\n\n    #qcx-admin-root .preview-meta {\n      display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px;\n    }\n    #qcx-admin-root .chip {\n      border: 1px solid var(--line, #1d2a1f); border-radius: 999px;\n      padding: 3px 8px; font: 500 10px/1 var(--mono);\n      color: var(--fg-dim, #8aa596); background: rgba(0,0,0,.2);\n    }\n    #qcx-admin-root .chip.bad { color: var(--danger, #ff5470); border-color: rgba(255,84,112,.4); }\n    #qcx-admin-root .chip.good { color: var(--qcx-admin-ok); border-color: rgba(125,206,160,.4); }\n\n    #qcx-admin-root .html-out {\n      margin: 0; max-height: 360px; overflow: auto;\n      background: #080d08; border: 1px solid var(--line, #1d2a1f);\n      border-radius: 7px; padding: 10px;\n      font: 11px/1.4 var(--mono);\n      white-space: pre-wrap; word-break: break-word; color: #9bb5a4;\n    }\n    #qcx-admin-root .hint {\n      color: var(--fg-dim, #8aa596); font-size: 11px;\n      margin: 3px 0 0; line-height: 1.35;\n    }\n    #qcx-admin-root .hint.publish {\n      margin-top: 8px;\n    }\n    #qcx-admin-root code {\n      font-family: var(--mono);\n      color: var(--qcx-admin-mint);\n      font-size: 0.92em;\n    }\n\n    #qcx-admin-root .seg {\n #qcx-admin-root) .the-article,\n    body:has(#qcx-admin-root) .post-body,\n    body:has(#qcx-admin-root) #main,\n    body:has(#qcx-admin-root) .main {\n      max-width: none !important;\n      width: 100% !important;\n      margin-left: auto !important;\n      margin-right: auto !important;\n      float: none !important;\n      grid-template-columns: 1fr !important;\n      display: block !important;\n    }\n    body:has(#qcx-admin-root) .main-wrapper,\n    body:has(#qcx-admin-root) .centered-bottom {\n      padding-left: 0 !important;\n      padding-right: 0 !important;\n    }\n    body:has(#qcx-admin-root) .content-outer,\n    body:has(#qcx-admin-root) .content-inner,\n    body:has(#qcx-admin-root) .column-center-outer,\n    body:has(#qcx-admin-root) .column-center-inner,\n    body:has(#qcx-admin-root) .main-inner,\n    body:has(#qcx-admin-root) #page_body,\n    body:has(#qcx-admin-root) .page {\n      max-width: none !important;\n      width: 100% !important;\n      margin-left: 0 !important;\n      margin-right: 0 !important;\n      float: none !important;\n      padding-left: 0 !important;\n      padding-right: 0 !important;\n    }\n    body:has(#qcx-admin-root:has(.gate:not(.hidden))) .qcx-follow-strip,\n    body:has(#qcx-admin-root:has(.gate:not(.hidden))) [class*=\"follow\"],\n    body:has(#qcx-admin-root:has(.gate:not(.hidden))) .widget.Profile,\n    body:has(#qcx-admin-root:has(.gate:not(.hidden))) .widget.Attribution {\n      display: none !important;\n    }";
})();

(function () {
  'use strict';

  var API_BASE = 'https://api.timkiem.app';
  var TOKEN_KEY = 'qcx_admin_token_v1';
  var DRAFT_KEY = 'qcx_admin_draft_v1';
  var BLOG_ID = '5252547691219049876';
  var mode = 'free';

  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var tokenInput = document.getElementById('tokenInput');
  var gateStatus = document.getElementById('gateStatus');
  var appStatus = document.getElementById('appStatus');
  var htmlOut = document.getElementById('htmlOut');
  var previewMeta = document.getElementById('previewMeta');
  var priceEl = document.getElementById('price');

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function readToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function saveToken(token) {
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  }

  function clearToken() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function slugify(value) {
    return String(value || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/đ/g, 'd')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80);
  }

  function escapeAttr(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /** Blogger/Google image CDN hosts used by Blogspot posts. */
  function isBloggerImageHost(url) {
    try {
      var host = new URL(String(url || ''), location.href).hostname.toLowerCase();
      if (host === 'blogger.googleusercontent.com') return true;
      if (/\.bp\.blogspot\.com$/.test(host) || host === 'bp.blogspot.com') return true;
      if (/^lh\d*\.googleusercontent\.com$/.test(host)) return true;
      return false;
    } catch (e) {
      return false;
    }
  }

  /**
   * Replace Blogspot size token in a CDN URL.
   * Shapes: /s1600/file.jpg | /=s1600 | /w640-h360-p-k-no-nu/file.jpg
   * Non-CDN URLs are returned unchanged.
   */
  function withBloggerSize(url, token) {
    var raw = String(url || '').trim();
    var size = String(token || 's1600').replace(/^\/+|\/+$/g, '');
    if (!raw || !isBloggerImageHost(raw)) return raw;
    try {
      var u = new URL(raw, location.href);
      var path = u.pathname;
      // /img/b/.../s####/name  or  /img/b/.../w#-h#-…/name
      if (/\/(?:s\d+(?:-[a-z0-9]+)*)\//i.test(path) || /\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i.test(path)) {
        path = path
          .replace(/\/(?:s\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/')
          .replace(/\/(?:[wh]\d+(?:-[a-z0-9]+)*)\//i, '/' + size + '/');
      } else if (/=s\d+(?:-[a-z0-9]+)*/i.test(path) || /=[wh]\d+(?:-[a-z0-9]+)*/i.test(path)) {
        // /img/a/HASH=s1600  or =w640-h360-…
        path = path
          .replace(/=s\d+(?:-[a-z0-9]+)*/i, '=' + size)
          .replace(/=[wh]\d+(?:-[a-z0-9]+)*/i, '=' + size);
      } else if (/\/s\d+(?:-[a-z0-9]+)*$/i.test(path) || /\/[wh]\d+(?:-[a-z0-9]+)*$/i.test(path)) {
        path = path
          .replace(/\/s\d+(?:-[a-z0-9]+)*$/i, '/' + size)
          .replace(/\/[wh]\d+(?:-[a-z0-9]+)*$/i, '/' + size);
      } else {
        // No size segment — insert before filename if path has a trailing file
        path = path.replace(/\/([^\/]+)$/, '/' + size + '/$1');
      }
      u.pathname = path;
      return u.toString();
    } catch (e) {
      return raw;
    }
  }

  function normalizeHeroUrl(url) {
    var raw = String(url || '').trim();
    if (!raw) return '';
    if (!isBloggerImageHost(raw)) return raw;
    return withBloggerSize(raw, 's1600');
  }

  function parseLabels(raw, currentMode, price) {
    var parts = String(raw || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var need = currentMode === 'paid' ? 'VIP' : 'FREE';
    var hasNeed = parts.some(function (p) { return p.toUpperCase() === need; });
    if (!hasNeed) parts.unshift(need);
    if (currentMode === 'paid' && price) {
      var hasPrice = parts.some(function (p) { return p === price; });
      if (!hasPrice) parts.push(price);
    }
    return parts;
  }

  function collectForm() {
    var title = document.getElementById('title').value.trim();
    var slug = document.getElementById('slug').value.trim() || slugify(title);
    var price = priceEl.value.trim();
    var labels = parseLabels(document.getElementById('labels').value, mode, price);
    var heroRaw = document.getElementById('hero').value.trim();
    var hero = normalizeHeroUrl(heroRaw);
    return {
      title: title,
      slug: slug,
      resourceId: slug,
      mode: mode,
      price: price,
      labels: labels,
      hero: hero,
      heroRaw: heroRaw,
      heroIsCdn: !heroRaw || isBloggerImageHost(heroRaw),
      teaser: document.getElementById('teaser').value.trim(),
      locked: document.getElementById('locked').value.trim(),
      driveUrl: document.getElementById('driveUrl').value.trim(),
      notesHtml: document.getElementById('notesHtml').value.trim(),
      blogId: BLOG_ID
    };
  }

  function buildPostHtml(data) {
    var parts = [];
    if (data.hero) {
      var heroSrc = normalizeHeroUrl(data.hero);
      parts.push(
        '<div class="mac-frame mac-frame-image mac-orient-portrait">' +
        '<div class="mac-frame-header"><div class="mac-dots">' +
        '<span class="mac-dot mac-red"></span><span class="mac-dot mac-yellow"></span><span class="mac-dot mac-green"></span>' +
        '</div><div class="mac-title">preview</div><div class="mac-spacer"></div></div>' +
        '<div class="mac-frame-content"><img alt="' + escapeAttr(data.title || 'hero') + '" src="' + escapeAttr(heroSrc) + '"/></div>' +
        '</div>'
      );
    }
    if (data.teaser) parts.push('<div class="qcx-teaser">\n' + data.teaser + '\n</div>');

    var marker =
      '<div id="qcx-resource" class="qcx-resource-marker" data-mode="' + escapeAttr(data.mode) + '"' +
      ' data-resource-id="' + escapeAttr(data.resourceId) + '"' +
      ' data-title="' + escapeAttr(data.title) + '"' +
      (data.mode === 'paid' && data.price ? ' data-price="' + escapeAttr(data.price) + '"' : '') +
      ' style="display:none!important">resource:' + escapeAttr(data.resourceId) + '</div>';
    parts.push(marker);

    var locked = data.locked || '<!-- locked content -->';
    parts.push('<div class="container"><div class="qcx-content-unlock" style="display:none">\n' + locked + '\n</div></div>');
    return parts.join('\n\n');
  }

  function validate(data, forVault) {
    var errors = [];
    if (!data.title) errors.push('Thiếu title');
    if (!data.resourceId) errors.push('Thiếu slug/resourceId');
    if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.resourceId)) {
      errors.push('resourceId chỉ dùng a-z 0-9 và dấu gạch ngang');
    }
    if (!data.locked) errors.push('Thiếu locked HTML');
    if (forVault && !data.driveUrl) errors.push('Thiếu driveUrl cho vault');
    if (data.mode === 'paid' && !data.price) errors.push('Paid cần price');
    var html = buildPostHtml(data);
    if (/drive\.google\.com/i.test(html)) errors.push('HTML body không được chứa drive.google.com');
    if (/drive\.google\.com/i.test(data.teaser + data.locked)) {
      errors.push('Teaser/locked chứa Drive — chuyển sang vault');
    }
    return { ok: !errors.length, errors: errors, html: html };
  }

  function renderPreview() {
    var data = collectForm();
    var check = validate(data, false);
    htmlOut.textContent = check.html;
    var chips = [];
    chips.push('<span class="chip">mode=' + data.mode + '</span>');
    chips.push('<span class="chip">id=' + (data.resourceId || '—') + '</span>');
    chips.push('<span class="chip">labels=' + data.labels.join('|') + '</span>');
    if (data.heroRaw) {
      if (!data.heroIsCdn) {
        chips.push('<span class="chip bad">Hero không phải CDN Blogspot</span>');
      } else if (data.hero !== data.heroRaw) {
        chips.push('<span class="chip good">hero→s1600</span>');
      } else {
        chips.push('<span class="chip good">hero CDN</span>');
      }
    }
    if (/drive\.google\.com/i.test(check.html)) {
      chips.push('<span class="chip bad">Drive trong HTML</span>');
    } else {
      chips.push('<span class="chip good">No Drive in HTML</span>');
    }
    if (check.ok) chips.push('<span class="chip good">contract ok</span>');
    else chips.push('<span class="chip bad">' + check.errors[0] + '</span>');
    previewMeta.innerHTML = chips.join('');
    return check;
  }

  function persistDraft() {
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(collectForm())); } catch (e) {}
  }

  function restoreDraft() {
    try {
      var raw = sessionStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      document.getElementById('title').value = d.title || '';
      document.getElementById('slug').value = d.slug || d.resourceId || '';
      document.getElementById('labels').value = (d.labels || []).join(', ');
      document.getElementById('hero').value = d.hero || '';
      document.getElementById('teaser').value = d.teaser || '';
      document.getElementById('locked').value = d.locked || '';
      document.getElementById('driveUrl').value = d.driveUrl || '';
      document.getElementById('notesHtml').value = d.notesHtml || '';
      priceEl.value = d.price || '';
      setMode(d.mode === 'paid' ? 'paid' : 'free');
    } catch (e) {}
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
    priceEl.disabled = mode !== 'paid';
    var labels = document.getElementById('labels');
    if (mode === 'free' && !/FREE/i.test(labels.value)) {
      labels.value = labels.value ? ('FREE, ' + labels.value.replace(/^\s*VIP\s*,?\s*/i, '')) : 'FREE';
    }
    if (mode === 'paid' && !/VIP/i.test(labels.value)) {
      labels.value = labels.value ? ('VIP, ' + labels.value.replace(/^\s*FREE\s*,?\s*/i, '')) : 'VIP';
    }
  }

  function showApp() {
    gate.classList.add('hidden');
    gate.setAttribute('hidden', 'true');
    gate.style.display = 'none';
    app.classList.remove('hidden');
    app.removeAttribute('hidden');
    app.style.display = '';
    restoreDraft();
    renderPreview();
  }

  function showGate() {
    clearToken();
    app.classList.add('hidden');
    app.setAttribute('hidden', 'true');
    app.style.display = 'none';
    gate.classList.remove('hidden');
    gate.removeAttribute('hidden');
    gate.style.display = '';
    clearGateStatus();
  }

  function clearGateStatus() {
    gateStatus.textContent = '';
    gateStatus.className = 'status hidden';
    gateStatus.setAttribute('hidden', 'true');
  }

  document.getElementById('btnUnlockAdmin').addEventListener('click', function () {
    var password = tokenInput.value.trim();
    if (!password) {
      gateStatus.removeAttribute('hidden');
      setStatus(gateStatus, 'Nhập mật khẩu.', 'err');
      return;
    }
    var btn = document.getElementById('btnUnlockAdmin');
    btn.disabled = true;
    gateStatus.removeAttribute('hidden');
    setStatus(gateStatus, 'Đang xác thực…', 'warn');
    fetch(API_BASE + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok || !res.j.token) {
          setStatus(gateStatus, (res.j && res.j.error) || 'Sai mật khẩu.', 'err');
          return;
        }
        saveToken(res.j.token);
        tokenInput.value = '';
        clearGateStatus();
        showApp();
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(gateStatus, 'Không kết nối được api.timkiem.app.', 'err');
      });
  });

  document.getElementById('btnLogout').addEventListener('click', showGate);

  Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function (btn) {
    btn.addEventListener('click', function () { setMode(btn.getAttribute('data-mode')); persistDraft(); renderPreview(); });
  });

  function setBodyTab(tab) {
    Array.prototype.forEach.call(document.querySelectorAll('#bodyTabSeg button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#bodyTabs .body-pane'), function (pane) {
      var on = pane.getAttribute('data-pane') === tab;
      pane.classList.toggle('hidden', !on);
      if (on) pane.removeAttribute('hidden');
      else pane.setAttribute('hidden', 'true');
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#bodyTabSeg button'), function (btn) {
    btn.addEventListener('click', function () { setBodyTab(btn.getAttribute('data-tab')); });
  });

  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { renderPreview(); }, 280);
  }

  ['title', 'slug', 'labels', 'hero', 'teaser', 'locked', 'driveUrl', 'notesHtml', 'price'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      if (id === 'title' && !document.getElementById('slug').dataset.touched) {
        document.getElementById('slug').value = slugify(document.getElementById('title').value);
      }
      persistDraft();
      schedulePreview();
    });
  });
  document.getElementById('slug').addEventListener('input', function () {
    this.dataset.touched = '1';
  });

  document.getElementById('btnToggleSource').addEventListener('click', function () {
    htmlOut.classList.toggle('collapsed');
    this.textContent = htmlOut.classList.contains('collapsed') ? 'Source' : 'Ẩn source';
  });

  document.getElementById('btnAiGen').addEventListener('click', function () {
    var brief = (document.getElementById('aiBrief').value || '').trim();
    if (brief.length < 8) {
      setStatus(appStatus, 'Brief AI cần ≥ 8 ký tự.', 'err');
      return;
    }
    var token = readToken();
    if (!token) { showGate(); return; }
    var btn = document.getElementById('btnAiGen');
    var model = document.getElementById('aiModel').value;
    btn.disabled = true;
    setStatus(appStatus, 'AI đang gen (' + model + ')…', 'warn');
    fetch(API_BASE + '/api/admin/generate', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        brief: brief,
        mode: mode,
        model: model,
        titleHint: document.getElementById('title').value || undefined
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.ok) {
          setStatus(appStatus, (res.j && res.j.error) || 'AI gen thất bại.', 'err');
          return;
        }
        var j = res.j;
        if (j.title) document.getElementById('title').value = j.title;
        if (j.slug) {
          document.getElementById('slug').value = j.slug;
          document.getElementById('slug').dataset.touched = '1';
        }
        if (j.labelsCsv) document.getElementById('labels').value = j.labelsCsv;
        else if (j.labels && j.labels.join) document.getElementById('labels').value = j.labels.join(', ');
        if (j.teaserHtml) document.getElementById('teaser').value = j.teaserHtml;
        if (j.lockedHtml) document.getElementById('locked').value = j.lockedHtml;
        persistDraft();
        renderPreview();
        setBodyTab('teaser');
        setStatus(appStatus, 'AI OK · đã điền title/teaser/locked/labels. Điền Drive rồi Lưu vault.', 'ok');
      })
      .catch(function () {
        btn.disabled = false;
        setStatus(appStatus, 'Không gọi được /api/admin/generate.', 'err');
      });
  });

  document.getElementById('btnPreview').addEventListener('click', function () {
    var check = renderPreview();
    htmlOut.classList.remove('collapsed');
    document.getElementById('btnToggleSource').textContent = 'Ẩn source';
    setStatus(appStatus, check.ok ? 'HTML contract OK.' : check.errors.join('\n'), check.ok ? 'ok' : 'err');
  });

  document.getElementById('btnCopy').addEventListener('click', function () {
    var check = renderPreview();
    if (!check.ok) {
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    navigator.clipboard.writeText(check.html).then(function () {
      setStatus(appStatus, 'Đã copy HTML body.', 'ok');
    }).catch(function () {
      setStatus(appStatus, 'Copy thất bại — chọn text trong preview.', 'warn');
    });
  });

  document.getElementById('btnVault').addEventListener('click', function () {
    var data = collectForm();
    var check = validate(data, true);
    renderPreview();
    if (!check.ok) {
      setStatus(appStatus, check.errors.join('\n'), 'err');
      return;
    }
    var token = readToken();
    if (!token) {
      showGate();
      return;
    }
    var body = {
      mode: data.mode,
      title: data.title,
      driveUrl: data.driveUrl,
      notesHtml: data.notesHtml || undefined
    };
    if (data.mode === 'paid') body.price = data.price;

    setStatus(appStatus, 'Đang PUT vault…');
    fetch(API_BASE + '/api/admin/resources/' + encodeURIComponent(data.resourceId), {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var parsed = null;
        try { parsed = JSON.parse(text); } catch (e) {}
        if (!res.ok) {
          throw new Error((parsed && (parsed.error || parsed.message)) || ('HTTP ' + res.status + ' ' + text.slice(0, 180)));
        }
        setStatus(appStatus, 'Vault OK · resourceId=' + data.resourceId, 'ok');
      });
    }).catch(function (err) {
      setStatus(appStatus, 'Vault lỗi: ' + (err && err.message ? err.message : err), 'err');
    });
  });

  function buildPayload() {
    var data = collectForm();
    var check = validate(data, false);
    return {
      blogId: BLOG_ID,
      title: data.title,
      labels: data.labels,
      customSlug: data.resourceId,
      resourceId: data.resourceId,
      mode: data.mode,
      price: data.price,
      html: check.html,
      driveUrl: data.driveUrl,
      notesHtml: data.notesHtml,
      createdAt: new Date().toISOString(),
      validation: check
    };
  }

  document.getElementById('btnPayload').addEventListener('click', function () {
    var payload = buildPayload();
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qcx-publish-' + payload.resourceId + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(appStatus, 'Đã tải payload JSON cho _publish_blogger_post.py', 'ok');
  });

  document.getElementById('btnPublishHint').addEventListener('click', function () {
    var payload = buildPayload();
    renderPreview();
    if (!payload.validation.ok) {
      setStatus(appStatus, payload.validation.errors.join('\n'), 'err');
      return;
    }
    try {
      localStorage.setItem('qcx_publish_payload_v1', JSON.stringify(payload));
    } catch (e) {}
    setStatus(
      appStatus,
      'Payload sẵn sàng.\n1) Lưu vault\n2) Tải JSON hoặc dùng localStorage key qcx_publish_payload_v1\n3) python _publish_blogger_post.py qcx-publish-' +
        payload.resourceId + '.json\n(Chrome profile đã login Blogger)',
      'warn'
    );
  });

  if (readToken()) showApp();
  else clearGateStatus();
})();
  
</script>
